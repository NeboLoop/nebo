name: nebo-server-image

# Builds the headless Nebo server image (amd64) for the SaaS/cluster deploy and
# pushes it to GHCR. The frontend is built on a hosted runner (pinned pnpm 10,
# matching release.yml) while the build droplet boots, and embedded via
# rust-embed; the Rust binary compiles in Docker.
# Build an image when we actually want to ship one — NOT on every backend
# commit. The old `push: branches:[main] paths:[crates/**, ...]` trigger fired a
# cold ~32min build on every commit and burned the org's Actions minutes.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # ─── amd64 runner: a droplet that exists only for this run ─────────────
  # The image used to build on a GitHub-hosted 4-core runner (~30 min). It now
  # builds where every other amd64 build in the house does (release.yml's
  # Linux desktop build, neboloop's deploy): an 8-core droplet booted from the
  # golden snapshot nebo-runner-amd64-base, with a just-in-time runner good for
  # ONE job, deleted by the teardown job below whether the build passed or not.
  # Docker is installed at boot (Ubuntu's docker.io + docker-buildx, ~18 s), as
  # neboloop's deploy does; the layer cache stays in GHCR.
  amd64-runner:
    runs-on: ubuntu-latest # orchestration only — no build happens here
    outputs:
      droplet_id: ${{ steps.droplet.outputs.id }}
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # A just-in-time runner carries ONLY the labels named here, so the build
      # job's runs-on list spells them out in full.
      - name: Mint a one-job runner registration
        id: jit
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          cfg=$(gh api -X POST orgs/${{ github.repository_owner }}/actions/runners/generate-jitconfig \
            -f name="img-amd64-${{ github.run_id }}" -F runner_group_id=1 -f work_folder=_work \
            -f "labels[]=self-hosted" -f "labels[]=Linux" -f "labels[]=X64" \
            -f "labels[]=nebo-img-${{ github.run_id }}" -q .encoded_jit_config)
          echo "::add-mask::$cfg"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
      - name: Boot the droplet from the golden snapshot
        id: droplet
        run: |
          image=$(doctl compute image list-user --format ID,Name --no-header | awk '$2=="nebo-runner-amd64-base"{print $1}' | tail -n1)
          test -n "$image" || { echo "snapshot nebo-runner-amd64-base not found"; exit 1; }
          cat > user-data.sh <<'EOS'
          #!/bin/bash
          # A droplet booted from a snapshot comes up with root's password
          # expired, which blocks even key-based SSH; clear that so the box can
          # be inspected while it lives.
          chage -d "$(date +%F)" -M -1 root
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq docker.io docker-buildx
          usermod -aG docker runner
          systemctl enable --now docker
          cd /home/runner/actions-runner
          nohup sudo -u runner ./run.sh --jitconfig '__JIT__' > /home/runner/runner.log 2>&1 &
          EOS
          sed -i "s|__JIT__|${{ steps.jit.outputs.config }}|" user-data.sh
          # --ssh-keys suppresses DigitalOcean's root-password email; nobody logs in.
          # nyc3 capacity comes and goes per size: the first shape that boots
          # wins; any other error is fatal. Dedicated 16-vCPU shapes come first:
          # the link step and the biggest crates are CPU-bound, and the box
          # lives ~15 minutes (well under a dollar). The shared 8-vCPU shapes
          # are the fallback. Every shape needs >= 320 GB of disk (the
          # snapshot's minimum).
          id=""
          for size in c2-16vcpu-32gb c2-16vcpu-32gb-intel s-8vcpu-16gb s-8vcpu-16gb-amd s-8vcpu-16gb-intel s-4vcpu-16gb-320gb-intel; do
            if id=$(doctl compute droplet create "nebo-img-amd64-${{ github.run_id }}" \
                --region nyc3 --size "$size" --image "$image" \
                --tag-names nebo-ci-runner,run-${{ github.run_id }} \
                --ssh-keys 15:57:9d:98:dc:e4:b9:b5:69:e2:42:d8:08:86:08:86 \
                --user-data-file user-data.sh --wait --format ID --no-header 2>create.err); then
              echo "droplet size: $size"; break
            fi
            grep -q "not available in this region" create.err || { cat create.err; exit 1; }
            echo "$size is not available in nyc3 right now, trying the next size"
          done
          rm -f create.err user-data.sh
          [ -n "$id" ] || { echo "::error::no droplet size available in nyc3"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait for the runner to come online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "orgs/${{ github.repository_owner }}/actions/runners?name=img-amd64-${{ github.run_id }}" -q '.runners[0].status // "absent"')
            [ "$status" = online ] && { echo "runner online after $((i*10))s"; exit 0; }
            sleep 10
          done
          echo "runner never came online"; exit 1

  # Runs alongside the droplet boot, so the build job starts with it in hand.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (embedded by rust-embed)
        working-directory: app
        run: |
          npm install -g pnpm@10.33.2
          pnpm install --frozen-lockfile
          pnpm exec svelte-kit sync
          pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app/build
          include-hidden-files: true
          retention-days: 1

  build:
    needs: [amd64-runner, frontend]
    runs-on: [self-hosted, Linux, X64, "nebo-img-${{ github.run_id }}"]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: app/build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Flux's ImagePolicy only matches `main-<unix_ts>-<short_sha>` and orders
      # by the timestamp — the same tag convention every other image in the
      # cluster uses. Never `:latest` (Flux can't order it and the deploy repo
      # never references it).
      #
      # Non-main refs get a `dev-` prefix that Flux and the cloud-bot
      # reconciler both ignore: a branch build must NEVER become the fleet's
      # "newest" image — auto-update bots would advance onto unmerged code.
      # Dev tags are for hand-pinning a single test bot.
      - name: Compute image tag
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=main-$(date +%s)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(date +%s)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # Layer cache lives in GHCR, not GHA: the Rust dep layer alone is >1GB
      # and the repo's whole GHA cache is capped at 10GB, so GHA evicted the
      # dep layer between builds and every "warm" build ran cold. GHCR has no
      # cap. The gha cache-from stays only as a transition fallback. zstd
      # packs and unpacks the big dep layer several times faster than gzip;
      # it applies to the cache only, not to the pushed image.
      #
      # Compile cache: a private Spaces bucket shared by every build
      # (docker/server-cargo.sh). Its keys go in as BuildKit secrets, never as
      # build args, so no layer and no cache key ever holds them.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/neboloop/nebo-server:${{ steps.vars.outputs.tag }}
          build-args: |
            SCCACHE_BUCKET=nebo-ci-cache
            SCCACHE_ENDPOINT=nyc3.digitaloceanspaces.com
            SCCACHE_REGION=us-east-1
          secrets: |
            sccache_key=${{ secrets.SCCACHE_SPACES_KEY }}
            sccache_secret=${{ secrets.SCCACHE_SPACES_SECRET }}
          cache-from: |
            type=registry,ref=ghcr.io/neboloop/nebo-server:buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/neboloop/nebo-server:buildcache,mode=max,compression=zstd,oci-mediatypes=true

  amd64-runner-down:
    needs: [amd64-runner, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Delete this run's droplet, and any runner droplet older than three hours
        run: |
          doctl compute droplet delete --force --tag-name "run-${{ github.run_id }}" || true
          cutoff=$(date -u -d '3 hours ago' +%s)
          doctl compute droplet list --tag-name nebo-ci-runner --format ID,Created --no-header | while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ] && doctl compute droplet delete --force "$id" || true
          done
      # A one-job runner removes itself after its job; if the job never ran,
      # its registration would linger as offline. Remove it either way.
      - name: Remove the runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          id=$(gh api "orgs/${{ github.repository_owner }}/actions/runners?name=img-amd64-${{ github.run_id }}" -q '.runners[0].id // empty')
          [ -n "$id" ] && gh api -X DELETE "orgs/${{ github.repository_owner }}/actions/runners/$id" || true
