name: CI

# Two gates: frontend typecheck + unit tests, and the full cargo workspace
# test suite. The Rust job exists because its absence let a workflow
# regression AND the compile break that hid its test ship in one commit — the
# repo read green for weeks on frontend checks alone.
#
# push is main-only ON PURPOSE. A bare `push:` plus `pull_request:` ran every
# PR'd commit twice — and the concurrency group below could never dedupe the
# pair, because the two events carry different refs (refs/heads/... vs
# refs/pull/N/merge). PR commits get the pull_request run, which tests the
# merge ref — the better signal; direct pushes to main keep their own run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.2"
  RUST_VERSION: "1.95"

jobs:
  frontend:
    name: Frontend check & test
    # GH-hosted is correct here: the repo is public, so standard runners are
    # free and unmetered — the 2000 min/mo quota only meters private repos.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint / typecheck
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  rust:
    name: Cargo workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace debug-build plus the restored cache can crowd the
      # runner's ~14GB free disk, and a full disk kills test binaries with
      # SIGBUS (their pages are mmap'd from files that can no longer be
      # read back) — a crash that looks like memory corruption and isn't.
      # These preinstalled toolchains are dead weight for this job; dropping
      # them frees ~25-30GB.
      - name: Reclaim runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-test
          cache-on-failure: true

      # Same dependency set as release.yml's Linux leg — that recipe is already
      # hardened for this runner image; do not let the two drift.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential \
            protobuf-compiler \
            libopenblas-dev

      - name: Configure OpenBLAS paths
        run: |
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${MULTIARCH}/pkgconfig" >> $GITHUB_ENV
          # `-l openblas` is REQUIRED — turbovec's `cblas_sgemm` reference
          # otherwise goes unresolved at link time (see release.yml).
          echo "RUSTFLAGS=-C link-arg=-L/usr/lib/${MULTIARCH} -C link-arg=-Wl,--no-as-needed -C link-arg=-lopenblas -C link-arg=-Wl,--as-needed" >> $GITHUB_ENV

      # nebo-server embeds app/build via rust-embed (spa.rs) — the derive needs
      # the FOLDER to exist at compile time, but no test reads the embedded
      # assets, so an empty directory suffices. Building the real frontend here
      # would be minutes per run that the tests never observe.
      - name: Satisfy the frontend embed folder
        run: mkdir -p app/build

      # --exclude nebo: the desktop crate has no tests and its build script
      # wants ../app/build (frontendDist) — excluding it keeps this job free of
      # a frontend build. Everything else in the workspace runs.
      - name: Run tests
        run: cargo test --workspace --exclude nebo --no-fail-fast

      # A test binary dying of SIGBUS or an OOM-kill leaves its cause in the
      # kernel log and the disk numbers, not in cargo's output. Capture both
      # while the evidence exists, so the next crash is a diagnosis instead
      # of a rerun-and-hope.
      - name: Crash evidence (disk + kernel log)
        if: failure()
        run: |
          df -h
          sudo dmesg --ctime 2>/dev/null | tail -50 || true

  # Release builds live on the house Mac mini. This job fails any change that
  # moves them back to GitHub-hosted runners — it has happened before, and it
  # turned a 10-minute release into a 70-minute one. Rule: CLAUDE.md "Release builds".
  release-runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release-runners.py
