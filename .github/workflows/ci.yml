name: CI

# Two gates: frontend typecheck + unit tests, and the full cargo workspace
# test suite. The Rust job exists because its absence let a workflow
# regression AND the compile break that hid its test ship in one commit — the
# repo read green for weeks on frontend checks alone.
#
# push is main-only ON PURPOSE. A bare `push:` plus `pull_request:` ran every
# PR'd commit twice — and the concurrency group below could never dedupe the
# pair, because the two events carry different refs (refs/heads/... vs
# refs/pull/N/merge). PR commits get the pull_request run, which tests the
# merge ref — the better signal; direct pushes to main keep their own run.
on:
  push:
    # harness/turn-controller is the rewrite's integration branch: its PRs are
    # merged the moment they pass locally, which cancels their PR runs, so
    # each merge is tested here at the branch tip. The cutover to main
    # removes this entry along with the branch.
    branches: [main, harness/turn-controller]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.2"
  RUST_VERSION: "1.95"

jobs:
  frontend:
    name: Frontend check & test
    # Our runners only: the org's GitHub Actions budget is capped. Fork PRs
    # never run on our machines (they get no secrets either).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, neboloop] # the Mac mini's Lima VM
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint / typecheck
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # ─── x86 runner: a DigitalOcean droplet that exists only for this run ───
  # GitHub-hosted runners are never used (the org's Actions budget is spent).
  # This job only calls doctl and gh, on the stadium orchestration runners;
  # the droplet boots from the nebo-runner-amd64-base snapshot with a
  # just-in-time registration good for ONE job, and the -down job deletes it.
  cargo-runner:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, neboloop-orch] # orchestration only
    steps:
      # Install only. Up to four jobs share this VM's HOME, and `doctl auth
      # init` in each rewrote one shared config file under the others. Every
      # doctl call takes the token from the environment and a config dir of
      # its own job.
      - uses: digitalocean/action-doctl@v2
        with:
          no_auth: "true"
      # A just-in-time runner carries ONLY the labels named here, so the
      # build's runs-on list must spell them out in full.
      - name: Mint a one-job runner registration
        id: jit
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: nebo-ci-cargo-${{ github.run_id }}
          LABEL: nebo-cargo-${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cfg=$(gh api -X POST "orgs/$OWNER/actions/runners/generate-jitconfig" \
            -f name="$NAME" -F runner_group_id=1 -f work_folder=_work \
            -f "labels[]=self-hosted" -f "labels[]=Linux" -f "labels[]=X64" \
            -f "labels[]=$LABEL" -q .encoded_jit_config)
          echo "::add-mask::$cfg"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
      - name: Boot the droplet from the golden snapshot
        env:
          JIT: ${{ steps.jit.outputs.config }}
          NAME: nebo-ci-cargo-${{ github.run_id }}
          RUN_TAG: run-${{ github.run_id }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/doctl-config
        run: |
          image=$(doctl compute image list-user --format ID,Name --no-header | awk '$2=="nebo-runner-amd64-base"{print $1}' | tail -n1)
          test -n "$image" || { echo "snapshot nebo-runner-amd64-base not found"; exit 1; }
          ud="$RUNNER_TEMP/user-data-$NAME.sh"
          cat > "$ud" <<'EOS'
          #!/bin/bash
          # A droplet booted from a snapshot comes up with root's password
          # expired, which blocks even key-based SSH; clear that so the box
          # can be inspected while it lives.
          chage -d "$(date +%F)" -M -1 root
          cd /home/runner/actions-runner
          nohup sudo -u runner ./run.sh --jitconfig '__JIT__' > /home/runner/runner.log 2>&1 &
          EOS
          sed -i "s|__JIT__|$JIT|" "$ud"
          # --ssh-keys: with no key DigitalOcean emails the owner a root
          # password for every droplet. Nobody logs in.
          # nyc3 capacity comes and goes per size (a 422 "not available");
          # any other error is fatal.
          # Dedicated-CPU shapes first: on a shared 8-vCPU droplet the suite ran
          # 3x slower than on a hosted runner and its timing-sensitive tests
          # (permit ordering, a 30 s server start) failed. The shared shapes
          # are the fallback. Every shape has >= 320 GB disk (the snapshot's
          # minimum). The box lives for one test run.
          id=""
          for size in c2-16vcpu-32gb c2-16vcpu-32gb-intel s-8vcpu-16gb s-8vcpu-16gb-amd s-8vcpu-16gb-intel s-4vcpu-16gb-320gb-intel; do
            if id=$(doctl compute droplet create "$NAME" \
                --region nyc3 --size "$size" --image "$image" \
                --tag-names "nebo-ci-runner,$RUN_TAG" \
                --ssh-keys 15:57:9d:98:dc:e4:b9:b5:69:e2:42:d8:08:86:08:86 \
                --user-data-file "$ud" --wait --format ID --no-header 2>"$ud.err"); then
              echo "droplet size: $size"; break
            fi
            grep -q "not available in this region" "$ud.err" || { cat "$ud.err"; rm -f "$ud" "$ud.err"; exit 1; }
            echo "$size is not available in nyc3 right now, trying the next size"
          done
          rm -f "$ud" "$ud.err"
          [ -n "$id" ] || { echo "::error::no droplet size available in nyc3"; exit 1; }
      - name: Wait for the runner to come online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: nebo-ci-cargo-${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "orgs/$OWNER/actions/runners?name=$NAME" -q '.runners[0].status // "absent"')
            [ "$status" = online ] && { echo "runner online after $((i*10))s"; exit 0; }
            sleep 10
          done
          echo "runner never came online"; exit 1

  rust:
    name: Cargo workspace tests
    needs: [cargo-runner]
    # The full workspace build is too heavy for the stadium VM's shared 7 GiB
    # slice, so it runs on the x86 droplet booted above (320 GB disk; the
    # golden snapshot carries rustup and the Tauri/OpenBLAS/protobuf build
    # deps that release.yml's amd64 leg uses).
    runs-on: [self-hosted, Linux, X64, "nebo-cargo-${{ github.run_id }}"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-test
          cache-on-failure: true

      # Same dependency set as release.yml's Linux leg. The droplet's golden
      # snapshot carries them already (Ubuntu 24.04 names two of them
      # differently, so apt-get would fail on the list below): install only
      # when a header is missing. Do not let the two lists drift.
      - name: Install system dependencies
        run: |
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 openblas && command -v protoc >/dev/null; then
            echo "build deps present on the snapshot"; exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential \
            protobuf-compiler \
            libopenblas-dev

      - name: Configure OpenBLAS paths
        run: |
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${MULTIARCH}/pkgconfig" >> $GITHUB_ENV
          # `-l openblas` is REQUIRED — turbovec's `cblas_sgemm` reference
          # otherwise goes unresolved at link time (see release.yml).
          echo "RUSTFLAGS=-C link-arg=-L/usr/lib/${MULTIARCH} -C link-arg=-Wl,--no-as-needed -C link-arg=-lopenblas -C link-arg=-Wl,--as-needed" >> $GITHUB_ENV

      # nebo-server embeds app/build via rust-embed (spa.rs) — the derive needs
      # the FOLDER to exist at compile time. The only asset a test reads is the
      # app shell (a signed-in browser gets index.html: nebo_files_proof), so a
      # one-line shell stands in. Building the real frontend here would be
      # minutes per run that the tests never observe.
      - name: Satisfy the frontend embed folder
        run: |
          mkdir -p app/build
          printf '<!doctype html><html><head><title>Nebo</title></head><body></body></html>\n' > app/build/index.html

      # --exclude nebo: the desktop crate has no tests and its build script
      # wants ../app/build (frontendDist) — excluding it keeps this job free of
      # a frontend build. Everything else in the workspace runs.
      # Four tests at a time, the shape of the 4-core hosted runner this suite
      # was green on. With one per core on the 16-core droplet the agent
      # tests contend on futexes (kernel time 10x user time), run for
      # minutes each, and the timing-sensitive ones fail. The droplet's
      # extra cores still speed up the build.
      - name: Run tests
        env:
          RUST_TEST_THREADS: "4"
        run: cargo test --workspace --exclude nebo --no-fail-fast

      # A test binary dying of SIGBUS or an OOM-kill leaves its cause in the
      # kernel log and the disk numbers, not in cargo's output. Capture both
      # while the evidence exists, so the next crash is a diagnosis instead
      # of a rerun-and-hope.
      - name: Crash evidence (disk + kernel log)
        if: failure()
        run: |
          df -h
          sudo dmesg --ctime 2>/dev/null | tail -50 || true

  # Release builds live on the house Mac mini. This job fails any change that
  # moves them back to GitHub-hosted runners — it has happened before, and it
  # turned a 10-minute release into a 70-minute one. Rule: CLAUDE.md "Release builds".
  release-runners:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, neboloop-orch] # seconds of python3 + yaml
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release-runners.py

  # The droplet is deleted whether the job passed, failed, was cancelled or
  # never ran. NOTE: when two droplets exist in one run, each -down job
  # deletes by name, so it never kills the other job's droplet.
  cargo-runner-down:
    needs: [cargo-runner, rust]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, ARM64, neboloop-orch] # orchestration only
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          no_auth: "true"
      - name: Delete this run's droplet, and any runner droplet older than three hours
        env:
          NAME: nebo-ci-cargo-${{ github.run_id }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/doctl-config
        run: |
          doctl compute droplet list --tag-name nebo-ci-runner --format ID,Name --no-header \
            | awk -v n="$NAME" '$2==n{print $1}' | xargs -r doctl compute droplet delete --force || true
          cutoff=$(date -u -d '3 hours ago' +%s)
          doctl compute droplet list --tag-name nebo-ci-runner --format ID,Created --no-header | while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ] && doctl compute droplet delete --force "$id" || true
          done
      # A one-job runner removes itself after its job; if the job never ran,
      # its registration would linger as offline. Remove it either way.
      - name: Remove the runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: nebo-ci-cargo-${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          id=$(gh api "orgs/$OWNER/actions/runners?name=$NAME" -q '.runners[0].id // empty')
          [ -n "$id" ] && gh api -X DELETE "orgs/$OWNER/actions/runners/$id" || true
