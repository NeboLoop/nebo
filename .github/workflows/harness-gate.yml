name: Harness gate

# The agent harness is only as good as what the suites can prove. Two lanes:
#
#   gate    every PR and every push to main: the smoke and error-correction
#           suites with program checks only (no judge, no billed grader).
#           A failed critical check fails the job. Runs against a headless
#           server started in this job, running on Janus as a CI bot.
#
#   nightly the same suites judged by the claude CLI, three runs each, and the
#           correction rate must clear MIN_CORRECTION_RATE. Judged runs cost
#           money and take an hour, so they do not sit on the PR path.
#
# Secrets (repository settings, not this file):
#   HARNESS_NEBO_BOT_ID         a NeboAI bot provisioned for CI (36-char id)
#   HARNESS_NEBO_BOT_TOKEN      that bot's token; seeds the NeboAI profile the
#                               way a cloud pod's does, so the agent runs on
#                               Janus (nebo-1), the same backend customers get
#   HARNESS_NEBO_BOOT_TOKEN     that bot's boot credential (NEBO_BOOT_TOKEN), the
#                               one a rebuilt cloud pod boots with. Every run
#                               starts from an empty home, and the plain token
#                               goes stale on the first connect (rotation), so
#                               the state read before CONNECT and CONNECT itself
#                               need it. Minted by an admin with the NeboAI MCP
#                               cloud(resource: bot, action: boot_credential),
#                               sealed to this repo's Actions secrets key; minting
#                               again revokes the previous one
#   HARNESS_CLAUDE_OAUTH_TOKEN  nightly only: login for the claude CLI that
#                               judges the transcripts (CLAUDE_CODE_OAUTH_TOKEN)
#   HARNESS_P_NEBO_BOT_ID       the same three for a second CI bot, used by a
#   HARNESS_P_NEBO_BOT_TOKEN    dispatch with `arm: p`. A bot has one lease, so
#   HARNESS_P_NEBO_BOOT_TOKEN   arm A (the old loop) and arm P (the rewrite)
#                               can only run at once as two bots
#
# The agent runs on Janus; Claude Code only measures. GATE_MODEL pins the
# speed so a routing change cannot move the number.
#
# Runner: the house Mac mini's Lima VM (label neboloop), never a GitHub-hosted
# machine (see CLAUDE.md "Release builds" and scripts/check-release-runners.py).
# GitHub only triggers the job. Nothing of ours runs or is stored there: no
# hosted cache, no artifact upload. The build cache is the runner's own target
# directory, which persists between jobs, and every run's traces and server
# log stay on the VM under ~/harness-runs/<run id>. Two runners share that
# VM (stadium-org-1 and -2), so two gate jobs can run at once: each takes
# its own port from its runner name, and apt waits for the dpkg lock
# instead of failing on it (2026-09-20: every gate run for two weeks was
# exit 100 on the apt lock or "Cannot connect to Nebo" because both jobs
# started a server on 27895 and the first cleanup killed the other's).
#
# Arms. A dispatch can test other code than this commit: `ref` names the code
# under test (a branch, tag or sha), which builds the server; this commit
# still supplies the fixtures, the suites and the test runner, so two arms
# are measured by one instrument. `arm` picks the CI bot (a = HARNESS_NEBO_*,
# p = HARNESS_P_NEBO_*). The old loop is pinned as baseline/pre-harness;
# scripts/arm-report.py has the commands for an A-vs-P comparison.
#
# Isolation. Every job gets its own directory (GATE_JOB) with an empty home,
# /tmp, NEBO_HOME and working directory, and the server and the test runner
# run in that view through scripts/gate-sandbox.sh (bubblewrap): no run sees
# a file an earlier run left, another runner's work, or ~/harness-runs.
# Every run of every fixture, replay thread or not, gets a fresh server with
# an empty NEBO_HOME, home, /tmp and working directory (scripts/gate-run.sh,
# through scripts/gate-server.sh fresh), so no run recalls another's memory,
# nor a run its own fixture's earlier run's (2026-09-25: a run quoted the
# access code an earlier run of the same fixture had saved to memory).
#
# A sweep is the gate dispatched by hand with a `suites` list: any suites and
# fixtures, program checks by default or judged three runs each with `judge`.
# `runs` sets the runs per fixture either way.
#
# Judging is offline. A proof run (scripts/arm-report.py) is dispatched with
# judge off and runs=3: the gate records the traces and decides the program
# checks, and the judge runs later on the owner's Mac against the traces kept
# on the VM, under the Claude Code login there (no token):
#   nebo-cli test grade --traces ~/.cache/nebo-arm-runs/<run id> --grader sonnet
# (the fetch and the whole recipe: Proof-Scorecard.md). It is the same grader
# and the same checks `test run` uses. HARNESS_CLAUDE_OAUTH_TOKEN hit its
# weekly limit on 2026-09-25, and an in-run judge that fails leaves a run
# without its judged half.
# It replaces the gate's own two suites for that run only; with the inputs
# left empty, a dispatch is exactly the gate. A sweep has its own concurrency
# group and a longer timeout, so a push to the branch never cancels an
# hours-long sweep and a sweep never cancels the branch's gate.
#
# The concurrency group below drops superseded PR runs: on a pull_request
# event github.ref is refs/pull/<n>/merge, which is the same for every push
# to the PR, so a force-push cancels the run it replaced. What it cannot do
# is notice that the PR was merged — pr-closed-cancel.yml does that, and
# hands the runner back the moment the PR closes.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fixtures/**"
      - "suites/**"
      - "scripts/correction-rate.py"
      - ".github/workflows/harness-gate.yml"
  pull_request:
    # The same allowlist as the push lane, minus this file. Everything the
    # gate can actually prove is engine code, fixtures, suites and the
    # correction-rate script; a change to docs, to the app, or to a workflow
    # cannot move the number, and an hour of a house runner spent finding
    # that out is an hour main's own gate spends queued. A change to this
    # file still gets a real gate run — on demand through workflow_dispatch
    # before merge, and on the push lane once it lands on main.
    paths:
      - "crates/**"
      - "fixtures/**"
      - "suites/**"
      - "scripts/correction-rate.py"
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC nightly
  workflow_dispatch:
    inputs:
      suites:
        description: "Sweep: space-separated suite and fixture paths (suites/x.yaml, fixtures/.../y.yaml, replays/<set>/suite.yaml). Empty = the gate."
        type: string
        default: ""
      judge:
        description: "Sweep only: judge in the run with the claude CLI (HARNESS_CLAUDE_OAUTH_TOKEN). Proof runs leave this off and are judged offline with `nebo-cli test grade` (default: program checks)"
        type: boolean
        default: false
      runs:
        description: "Sweep only: runs per fixture (default: 3 when judged, 1 otherwise; proof runs: 3)"
        type: string
        default: ""
      ref:
        description: "Code under test: branch, tag or sha that builds the server (default: this commit). Fixtures, suites and the runner stay this commit's."
        type: string
        default: ""
      arm:
        description: "CI bot: a = HARNESS_NEBO_* (the default), p = HARNESS_P_NEBO_* (a second bot, so two arms run at once)"
        type: choice
        options: [a, p]
        default: a

concurrency:
  # A sweep's group carries its arm and code under test, so the two arms of a
  # comparison, dispatched from one branch, never cancel each other.
  group: harness-gate-${{ github.ref }}${{ inputs.suites && format('-sweep-{0}-{1}', inputs.arm, inputs.ref) || '' }}
  cancel-in-progress: true

env:
  GATE_MODEL: janus/nebo-1
  GATE_PORT: "27895"
  MIN_CORRECTION_RATE: "80"
  LEASE_WAIT_MINUTES: "45"

jobs:
  harness:
    name: ${{ github.event_name == 'schedule' && 'Nightly judged suites' || 'Program-check gate' }}
    runs-on: [self-hosted, Linux, ARM64, neboloop] # the Mac mini's Lima VM, see CLAUDE.md "Release builds"
    # Two gate jobs may run on the VM at once: each has its own port (#147,
    # #166) and its own fixture scratch dir (#157). A job-level concurrency
    # group was tried (#151) and dropped: GitHub keeps ONE pending job per
    # group, so a PR's queued run was silently replaced by the next PR's —
    # 35589080672 never ran. Queueing is the runners' job, not a group's.
    # Both jobs are the one CI bot, though, and the bot has one lease: the
    # second server waits for the first to hand it back (see "Start a
    # headless server"). That wait is bounded at LEASE_WAIT_MINUTES (45) and
    # each timeout below carries it on top of the lane's own budget
    # (60 gate, 120 nightly, 600 sweep).
    timeout-minutes: ${{ github.event_name == 'schedule' && 165 || inputs.suites && 645 || 105 }}
    env:
      RUSTC_WRAPPER: ""
      # One target directory for this checkout, the code under test and the
      # proof fixtures (which build from the job's working directory).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GATE_ARM: ${{ inputs.arm || 'a' }}
      GATE_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # Rust lives in the runner user's home on the VM; a non-login shell
      # does not have it on PATH.
      - name: Rust on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      # stadium-org-1 → 27891, stadium-org-2 → 27892; anything else keeps the default.
      - name: A port of this runner's own
        run: |
          n="${RUNNER_NAME##*-}"
          port="$GATE_PORT"
          case "$n" in [0-9]|[0-9][0-9]) port=$((27890 + n)) ;; esac
          echo "GATE_PORT=$port" >> "$GITHUB_ENV"
          echo "runner $RUNNER_NAME → port $port"

      # Same dependency set as release.yml's Linux leg, already present on the
      # VM; apt is idempotent, so this only pays when the VM is rebuilt.
      - name: Install system dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=900 update
          sudo apt-get -o DPkg::Lock::Timeout=900 install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential \
            protobuf-compiler \
            libopenblas-dev \
            python3-yaml \
            bubblewrap

      - name: Configure OpenBLAS paths
        run: |
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${MULTIARCH}/pkgconfig" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-L/usr/lib/${MULTIARCH} -C link-arg=-Wl,--no-as-needed -C link-arg=-lopenblas -C link-arg=-Wl,--as-needed" >> $GITHUB_ENV

      - name: Satisfy the frontend embed folder
        run: mkdir -p app/build

      # Everything this job writes lives here; nothing an earlier job left is
      # read. home, tmp and work are what the server and the runner see as
      # $HOME, /tmp and their working directory (scripts/gate-sandbox.sh).
      - name: A job directory of its own
        run: |
          job="${{ runner.temp }}/gate"
          rm -rf "$job"
          mkdir -p "$job"/{home,tmp,work,bin,nebo-home,traces}
          echo "GATE_JOB=$job" >> "$GITHUB_ENV"

      # The runner (and the fixtures and suites) always come from this commit.
      - name: Build the CLI
        run: |
          cargo build -p nebo-cli
          cp target/debug/nebo-cli "$GATE_JOB/bin/nebo-runner"

      - name: Check out the code under test
        if: inputs.ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: under-test

      # Same target directory, so its cache serves both trees.
      - name: Build the server under test
        run: |
          if [ -n "$GATE_REF" ]; then
            mkdir -p under-test/app/build
            (cd under-test && cargo build -p nebo-cli)
            code=under-test
          else
            code=.
          fi
          cp target/debug/nebo-cli "$GATE_JOB/bin/nebo-server"
          echo "GATE_CODE_SHA=$(git -C "$code" rev-parse HEAD)" >> "$GITHUB_ENV"
          # The working directory: the code under test, without the checks.
          # Kept as a tarball too: a replay run's fresh server gets a fresh copy.
          git -C "$code" archive HEAD -- . ':!fixtures' ':!suites' > "$GATE_JOB/work.tar"
          tar -x -C "$GATE_JOB/work" -f "$GATE_JOB/work.tar"
          echo "server: $(git -C "$code" log --oneline -1)"

      # `rg` next to the server, as on a customer's machine: the installers
      # ship the official ripgrep beside the nebo binary (release.yml, Tauri
      # externalBin), and every command's PATH leads with the binary's own
      # directory (PluginStore::path_with_plugins), so run_command finds it.
      # `make stage-ripgrep` fetches that same release for this host.
      - name: Stage the bundled ripgrep next to the server
        run: |
          make stage-ripgrep
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          cp "src-tauri/binaries/rg-$triple" "$GATE_JOB/bin/rg"
          "$GATE_JOB/bin/rg" --version | head -1

      # A fresh NEBO_HOME, the arm's CI bot, Janus confirmed as the provider:
      # scripts/gate-server.sh says how and why.
      - name: Start a headless server
        env:
          A_BOT_ID: ${{ secrets.HARNESS_NEBO_BOT_ID }}
          A_BOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOT_TOKEN }}
          A_BOOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOOT_TOKEN }}
          P_BOT_ID: ${{ secrets.HARNESS_P_NEBO_BOT_ID }}
          P_BOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOT_TOKEN }}
          P_BOOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOOT_TOKEN }}
          GATE_SUITES: ${{ inputs.suites }}
          GATE_JUDGE: ${{ inputs.judge }}
        run: scripts/gate-server.sh start

      # Every run on a fresh server (scripts/gate-run.sh); the bot's
      # credentials are for that server, never for the test runner.
      - name: Smoke suite, program checks
        if: github.event_name != 'schedule' && !inputs.suites
        env:
          A_BOT_ID: ${{ secrets.HARNESS_NEBO_BOT_ID }}
          A_BOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOT_TOKEN }}
          A_BOOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOOT_TOKEN }}
          P_BOT_ID: ${{ secrets.HARNESS_P_NEBO_BOT_ID }}
          P_BOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOT_TOKEN }}
          P_BOOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOOT_TOKEN }}
        run: scripts/gate-run.sh suites/smoke.yaml 3 "$GATE_JOB/traces/smoke" scripts/gate-sandbox.sh "$GATE_JOB/bin/nebo-runner" test run --no-judge --model "$GATE_MODEL"

      - name: Error-correction suite, program checks
        if: github.event_name != 'schedule' && !inputs.suites
        env:
          A_BOT_ID: ${{ secrets.HARNESS_NEBO_BOT_ID }}
          A_BOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOT_TOKEN }}
          A_BOOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOOT_TOKEN }}
          P_BOT_ID: ${{ secrets.HARNESS_P_NEBO_BOT_ID }}
          P_BOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOT_TOKEN }}
          P_BOOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOOT_TOKEN }}
        run: scripts/gate-run.sh suites/error-correction.yaml 1 "$GATE_JOB/traces/correction" scripts/gate-sandbox.sh "$GATE_JOB/bin/nebo-runner" test run --no-judge --model "$GATE_MODEL"

      # The VM has no node. Anthropic's native installer puts a standalone
      # `claude` in ~/.local/bin; it persists on the runner, so this is a
      # no-op after the first nightly.
      - name: Install the judge
        if: github.event_name == 'schedule' || (inputs.suites && inputs.judge)
        run: |
          command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Error-correction suite, judged, three runs
        if: github.event_name == 'schedule'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.HARNESS_CLAUDE_OAUTH_TOKEN }}
          A_BOT_ID: ${{ secrets.HARNESS_NEBO_BOT_ID }}
          A_BOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOT_TOKEN }}
          A_BOOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOOT_TOKEN }}
          P_BOT_ID: ${{ secrets.HARNESS_P_NEBO_BOT_ID }}
          P_BOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOT_TOKEN }}
          P_BOOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOOT_TOKEN }}
        run: |
          scripts/gate-run.sh suites/error-correction.yaml 3 "$GATE_JOB/traces/correction" \
            scripts/gate-sandbox.sh "$GATE_JOB/bin/nebo-runner" test run --grader claude-opus-5 --model "$GATE_MODEL" || true
          python3 scripts/correction-rate.py "$GATE_JOB/traces/correction" suites/error-correction.yaml --min "$MIN_CORRECTION_RATE"
          python3 scripts/error-shapes.py "$GATE_JOB/traces/correction" --baseline suites/error-shapes.baseline.txt

      - name: Smoke suite, judged
        if: github.event_name == 'schedule'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.HARNESS_CLAUDE_OAUTH_TOKEN }}
          A_BOT_ID: ${{ secrets.HARNESS_NEBO_BOT_ID }}
          A_BOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOT_TOKEN }}
          A_BOOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOOT_TOKEN }}
          P_BOT_ID: ${{ secrets.HARNESS_P_NEBO_BOT_ID }}
          P_BOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOT_TOKEN }}
          P_BOOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOOT_TOKEN }}
        run: scripts/gate-run.sh suites/smoke.yaml 3 "$GATE_JOB/traces/smoke" scripts/gate-sandbox.sh "$GATE_JOB/bin/nebo-runner" test run --grader claude-opus-5 --model "$GATE_MODEL"

      # Each entry runs to the end whatever the one before it did; the step
      # fails if any entry did. Traces land in $GATE_JOB/traces/<entry name>
      # (a replay set's under its set name). Every run of every fixture gets
      # a fresh server (scripts/gate-run.sh), so a run that fails leaves the
      # next runs to go ahead on their own servers. The bot's credentials are
      # here for those servers, never for the test runner.
      - name: Sweep the listed suites and fixtures
        if: inputs.suites
        env:
          SUITES: ${{ inputs.suites }}
          JUDGE: ${{ inputs.judge }}
          RUNS: ${{ inputs.runs }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.judge && secrets.HARNESS_CLAUDE_OAUTH_TOKEN || '' }}
          A_BOT_ID: ${{ secrets.HARNESS_NEBO_BOT_ID }}
          A_BOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOT_TOKEN }}
          A_BOOT_TOKEN: ${{ secrets.HARNESS_NEBO_BOOT_TOKEN }}
          P_BOT_ID: ${{ secrets.HARNESS_P_NEBO_BOT_ID }}
          P_BOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOT_TOKEN }}
          P_BOOT_TOKEN: ${{ secrets.HARNESS_P_NEBO_BOOT_TOKEN }}
        run: |
          if [ "$JUDGE" = "true" ]; then judge=(--grader claude-opus-5); runs=3; else judge=(--no-judge); runs=1; fi
          if [ -n "$RUNS" ]; then
            case "$RUNS" in *[!0-9]*|0) echo "runs must be a positive number, got '$RUNS'"; exit 1 ;; esac
            runs=$RUNS
          fi
          failed=""
          for entry in $SUITES; do
            case "$entry" in
              replays/*/suite.yaml) name=$(basename "$(dirname "$entry")") ;;
              *) name=$(basename "$entry" .yaml) ;;
            esac
            echo "::group::$entry"
            scripts/gate-run.sh "$entry" "$runs" "$GATE_JOB/traces/$name" \
              scripts/gate-sandbox.sh "$GATE_JOB/bin/nebo-runner" test run "${judge[@]}" --model "$GATE_MODEL" \
              || failed="$failed $entry"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }

      - name: Stop this job's server
        if: always()
        run: '[ -z "${GATE_JOB:-}" ] || scripts/gate-server.sh stop'

      - name: Keep the traces and the server log on the VM
        if: always()
        run: |
          KEEP="$HOME/harness-runs/${{ github.run_id }}"
          mkdir -p "$KEEP"
          [ -d "$GATE_JOB/traces" ] && cp -R "$GATE_JOB/traces" "$KEEP/"
          # One log for the job: every boot's, in order (a replay sweep boots once per run).
          cat "$GATE_JOB"/server-logs/*.log > "$KEEP/server.log" 2>/dev/null || true
          [ -f "$GATE_JOB/run.json" ] && jq --arg ended "$(date -u +%FT%TZ)" '. + {ended_at: $ended}' "$GATE_JOB/run.json" > "$KEEP/run.json"
          echo "kept at $KEEP on the stadium VM (limactl shell ci)"
