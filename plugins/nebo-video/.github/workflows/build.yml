name: build

# Builds nebo-video for every platform with the pinned ffmpeg embedded (see
# scripts/fetch-ffmpeg.sh), and runs the end-to-end render test on each
# platform's own hardware.
#
# Same rule as Nebo's release builds: house machines only, never a
# GitHub-hosted runner for a build. (`ubuntu-latest` below only boots and
# deletes the amd64 droplet; nothing is compiled there.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  macos:
    runs-on: [self-hosted, macOS, stadium-mac]
    strategy:
      fail-fast: false
      matrix:
        # x86_64 is cross-built on the Apple-silicon mini; its test runs under Rosetta 2.
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Import signing certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm $RUNNER_TEMP/cert.p12
          # The mini lacks Apple's Developer ID intermediates (see Nebo's release.yml).
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -sSf -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN_PATH"
            rm "$RUNNER_TEMP/$ca.cer"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
      - name: Fetch ffmpeg
        run: scripts/fetch-ffmpeg.sh ${{ matrix.target }}
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build and sign plugin
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          codesign --force --options runtime --timestamp --sign "${SIGN_IDENTITY:--}" \
            target/${{ matrix.target }}/release/nebo-video
      - uses: actions/upload-artifact@v4
        with:
          name: nebo-video-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nebo-video

  linux-amd64-runner:
    runs-on: ubuntu-latest # orchestration only — no build happens here
    outputs:
      droplet_id: ${{ steps.droplet.outputs.id }}
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # A just-in-time runner carries only the labels named here.
      - name: Mint a one-job runner registration
        id: jit
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          cfg=$(gh api -X POST orgs/${{ github.repository_owner }}/actions/runners/generate-jitconfig \
            -f name="do-amd64-video-${{ github.run_id }}" -F runner_group_id=1 -f work_folder=_work \
            -f "labels[]=self-hosted" -f "labels[]=Linux" -f "labels[]=X64" \
            -f "labels[]=nebo-video-amd64-${{ github.run_id }}" -q .encoded_jit_config)
          echo "::add-mask::$cfg"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
      - name: Boot the droplet from the golden snapshot
        id: droplet
        run: |
          image=$(doctl compute image list-user --format ID,Name --no-header | awk '$2=="nebo-runner-amd64-base"{print $1}' | tail -n1)
          test -n "$image" || { echo "snapshot nebo-runner-amd64-base not found"; exit 1; }
          cat > user-data.sh <<'EOS'
          #!/bin/bash
          chage -d "$(date +%F)" -M -1 root
          cd /home/runner/actions-runner
          nohup sudo -u runner ./run.sh --jitconfig '__JIT__' > /home/runner/runner.log 2>&1 &
          EOS
          sed -i "s|__JIT__|${{ steps.jit.outputs.config }}|" user-data.sh
          id=""
          for size in s-8vcpu-16gb s-8vcpu-16gb-amd s-8vcpu-16gb-intel s-4vcpu-16gb-320gb-intel; do
            if id=$(doctl compute droplet create "nebo-video-ci-amd64-${{ github.run_id }}" \
                --region nyc3 --size "$size" --image "$image" \
                --tag-names nebo-ci-runner,run-video-${{ github.run_id }} \
                --ssh-keys 15:57:9d:98:dc:e4:b9:b5:69:e2:42:d8:08:86:08:86 \
                --user-data-file user-data.sh --wait --format ID --no-header 2>create.err); then
              echo "droplet size: $size"; break
            fi
            grep -q "not available in this region" create.err || { cat create.err; exit 1; }
          done
          rm -f create.err user-data.sh
          [ -n "$id" ] || { echo "::error::no droplet size available in nyc3"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait for the runner to come online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "orgs/${{ github.repository_owner }}/actions/runners?name=do-amd64-video-${{ github.run_id }}" -q '.runners[0].status // "absent"')
            [ "$status" = online ] && exit 0
            sleep 10
          done
          echo "runner never came online"; exit 1

  linux:
    needs: linux-amd64-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Linux, ARM64, neboloop]
            target: aarch64-unknown-linux-gnu
          - runner: [self-hosted, Linux, X64, "nebo-video-amd64-${{ github.run_id }}"]
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch ffmpeg
        run: scripts/fetch-ffmpeg.sh ${{ matrix.target }}
      - name: Test
        run: cargo test --release
      - name: Build plugin
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: nebo-video-${{ matrix.target }}
          path: target/release/nebo-video

  linux-amd64-runner-down:
    needs: [linux-amd64-runner, linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Delete this run's droplet
        run: doctl compute droplet delete --force --tag-name "run-video-${{ github.run_id }}" || true
      - name: Remove the runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          id=$(gh api "orgs/${{ github.repository_owner }}/actions/runners?name=do-amd64-video-${{ github.run_id }}" -q '.runners[0].id // empty')
          [ -n "$id" ] && gh api -X DELETE "orgs/${{ github.repository_owner }}/actions/runners/$id" || true

  # The Windows ffmpeg is fetched on the arm64 Lima VM (the house Windows
  # box's shell lacks unzip); the plugin is built and tested on that box.
  windows-ffmpeg:
    runs-on: [self-hosted, Linux, ARM64, neboloop]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ffmpeg
        run: scripts/fetch-ffmpeg.sh x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-x86_64-pc-windows-msvc
          path: vendor/x86_64-pc-windows-msvc

  windows:
    needs: windows-ffmpeg
    runs-on: [self-hosted, Windows, X64, stadium-win]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      # The box's runner is NETWORK SERVICE under a Restricted execution
      # policy; same prep as Nebo's release.yml (proven there by
      # windows-runner-check.yml).
      - name: Runner prep (no admin needed)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; Get-ExecutionPolicy -List | Out-String"
          echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
          echo C:\Program Files\Git\usr\bin>> "%GITHUB_PATH%"
          set PWSH_DIR=%RUNNER_TEMP%\..\..\pwsh7
          if not exist "%PWSH_DIR%\pwsh.exe" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol='Tls12'; Invoke-WebRequest -Uri https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.zip -OutFile pwsh.zip; Expand-Archive -Force pwsh.zip '%PWSH_DIR%'; Remove-Item pwsh.zip"
          )
          "%PWSH_DIR%\pwsh.exe" -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; $PSVersionTable.PSVersion.ToString()"
          echo %PWSH_DIR%>> "%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-x86_64-pc-windows-msvc
          path: vendor/x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --release
      - name: Build plugin
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: nebo-video-x86_64-pc-windows-msvc
          path: target/release/nebo-video.exe
