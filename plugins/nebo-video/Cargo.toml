[package]
name = "nebo-video"
version = "0.1.0"
edition = "2024"
description = "Nebo plugin: ffmpeg-backed video assembly and editing"
license = "GPL-3.0-or-later"

# Keep this crate independent of the Nebo workspace so it can be built and
# published separately from the main repo.
[workspace]

[[bin]]
name = "nebo-video"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
sha2 = "0.10"
