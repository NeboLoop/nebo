<!doctype html>
<html lang="en" data-theme="clean">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#2F60C9" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- use-credentials: manifests fetch with credentials OMITTED by spec, so
		     without this the tunnel's auth gate 401s the request and
		     Add-to-Home-Screen dies (issues/tunnel-manifest-401-breaks-pwa-install.md). -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Deploy-window self-healing: during an image swap the HTML can come from
			// one server version and its hashed chunks from another, so the boot
			// import fails and the app would hang on the splash forever. Retry the
			// whole load with backoff (the window is seconds wide); a successful
			// boot clears the counter (root +layout onMount). Session-scoped so a
			// genuinely broken deploy stops after 3 tries instead of loop-reloading.
			(function () {
				var KEY = 'nebo:boot-retries';
				// A boot that dies silently must NEVER leave a blank page
				// (observed live 2026-08-28: iPhone over the tunnel — chunk
				// import fails, retries exhaust, white screen until a manual
				// refresh). One honest fallback screen, shown whenever the
				// app hasn't mounted: retries exhausted, an unmatched boot
				// error, or nothing at all after 12s.
				function showRecovery() {
					if (window.__NEBO_BOOTED || document.getElementById('nebo-recover')) return;
					// Inline styles are deliberate: this screen exists for the case
					// where the app's CSS chunks never arrived. Colors follow the
					// system scheme so it doesn't flashbang a dark phone at night.
					var dark = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
					var bg = dark ? '#111826' : '#ffffff';
					var fg = dark ? '#e5e7eb' : '#333333';
					var mut = dark ? '#9ca3af' : '#666666';
					var bd = dark ? '#374151' : '#cccccc';
					var d = document.createElement('div');
					d.id = 'nebo-recover';
					d.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:' + bg + ';color:' + fg + ';font-family:-apple-system,system-ui,sans-serif;z-index:99999;text-align:center;padding:24px';
					d.innerHTML = '<div style="font-size:17px;font-weight:600">Nebo didn\u2019t finish loading</div>' +
						'<div style="font-size:14px;color:' + mut + ';max-width:280px">The connection may have hiccuped. This usually works on the next try.</div>' +
						'<button style="padding:10px 22px;border:1px solid ' + bd + ';border-radius:10px;background:' + bg + ';color:' + fg + ';font-size:15px" onclick="sessionStorage.removeItem(\'nebo:boot-retries\');location.reload()">Try again</button>';
					document.body.appendChild(d);
				}
				function onFail(reason) {
					var msg = String((reason && reason.message) || reason || '');
					if (!/importing a module script failed|dynamically imported module/i.test(msg)) return;
					var n = Number(sessionStorage.getItem(KEY) || 0);
					if (n >= 3) { showRecovery(); return; }
					sessionStorage.setItem(KEY, String(n + 1));
					setTimeout(function () { location.reload(); }, 1500 * (n + 1));
				}
				// Every script error from the first byte on, with its stack, so an
				// error thrown while a chunk evaluates (before the app can listen)
				// is not lost. The root layout ships them on mount; if the app never
				// mounts, the watchdog below ships them itself.
				window.__NEBO_ERRORS = [];
				function record(reason, extra) {
					var stack = String((reason && reason.stack) || '').slice(0, 600);
					var msg = String((reason && reason.message) || reason || '');
					window.__NEBO_ERRORS.push({ at: Date.now(), msg: msg + (extra || ''), stack: stack });
				}
				function base() {
					var m = location.pathname.match(/^\/t\/[0-9a-fA-F-]{36}/);
					return m ? m[0] : '';
				}
				function ship(tag) {
					var errs = window.__NEBO_ERRORS.splice(0);
					if (!errs.length) return;
					try {
						fetch(base() + '/api/v1/client/events', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({ event: 'client_error', page: location.pathname, detail: tag + ' ' + JSON.stringify(errs).slice(0, 1800) }) });
					} catch (e) { /* the report is best-effort */ }
				}
				window.__NEBO_SHIP_ERRORS = ship;
				addEventListener('unhandledrejection', function (e) { record(e.reason, ' (unhandled)'); onFail(e.reason); });
				addEventListener('error', function (e) { record(e.error || e.message, ' @ ' + e.filename + ':' + e.lineno); onFail(e.error || e.message); }, true);
				setTimeout(function () { if (!window.__NEBO_BOOTED) ship('shell-unbooted'); }, 8000);
				// Watchdog: mounted apps set __NEBO_BOOTED (root layout onMount).
				// If nothing mounts — any silent death, matched or not — the
				// recovery screen appears instead of an endless blank.
				setTimeout(showRecovery, 12000);
			})();
			// Prevent Backspace from navigating back when not in an input (Tauri webview issue)
			document.addEventListener('keydown', function(e) {
				if (e.key === 'Backspace') {
					var t = e.target;
					if (!t.matches('input, textarea, select, [contenteditable="true"]')) {
						e.preventDefault();
					}
				}
			}, true);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
