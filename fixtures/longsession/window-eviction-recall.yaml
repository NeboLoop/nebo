id: window-eviction-recall
name: "Long session — sliding-window eviction must not lose an early fact"
description: |
  A fact is established in turn 1 (by reading a brief file), then 44 short
  filler turns push the conversation past the 80-message sliding-window cap
  (each turn adds a user + assistant row; eviction fires on len > 80 regardless
  of token budget — pruning.rs MAX_MESSAGE_COUNT). The final turn asks for the
  early fact. A healthy system answers correctly via the rolling summary,
  memory, or an honest re-read. The failure modes this guards: the agent
  claiming it never saw the brief, inventing a codename, or claiming it cannot
  read files (the forged "[os] 0 lines" outage class).
target_component: prompt

setup:
  - |
    mkdir -p /tmp/nebo-longsession
    cat > /tmp/nebo-longsession/brief.txt <<'EOF'
    PROJECT BRIEF (synthetic test data — nebo longsession fixture)
    ==============================================================
    Codename: VELVET-ORCA-72
    Deploy port: 45817
    Environment: staging-sim
    Owner: fixture-harness
    Notes: This file exists only to plant two recall targets (the codename
    and the deploy port) at the very start of a long conversation. Nothing
    else in this file matters.
    EOF
teardown:
  - "rm -rf /tmp/nebo-longsession"

conversation:
