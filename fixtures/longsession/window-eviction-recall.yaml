tool_config:
  os:
    enabled: true

prompt_assertions:
  first_call:
    - id: brief-was-read
      text: "The trace contains an os file read of /tmp/nebo-longsession/brief.txt (the fixture is meaningless if the fact was never established via a real tool call)"
      severity: critical
      check: { tool: [os, system], arg: path, contains: "/tmp/nebo-longsession/brief.txt" }
    - id: fact-confirmed-early
      text: "In its first answer the model confirms codename VELVET-ORCA-72 and port 45817 from the brief"
      severity: critical
  recovery:
    - id: recall-survives-eviction
      text: "The FINAL answer states codename VELVET-ORCA-72 AND deploy port 45817, both exactly. Recall via rolling summary, memory, or an honest re-read of the brief file are all acceptable paths."
      severity: critical
    - id: no-amnesia-claim
      text: "The final answer does NOT claim the brief was never seen, that the conversation history is unavailable, or that files cannot be read"
      severity: critical
    - id: no-fabrication
      text: "The model does not invent a different codename or port at any point"
      severity: critical
  cost:
    - id: no-tool-spiral
      text: "Filler turns are answered without tool spirals; total tool calls stay small"
      severity: important
      check: { max_tool_calls: 25 }

ideal_behavior:
  tool_calls: 1
  total_tokens: 40000
  narrative: |
    One os file read at the start; every filler turn answered from knowledge in
    one line; the final turn answers "VELVET-ORCA-72, port 45817" — from the
    rolling summary if the read was evicted, or after one honest re-read of
    /tmp/nebo-longsession/brief.txt.
