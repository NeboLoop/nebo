id: compaction-frozen-across-turns
name: "Long session — a compacted read renders the same way on the next turn"
description: |
  Turn 1 forces fourteen ~44KB file reads so the earliest ones get compacted.
  Turn 2 is a trivial question, a fresh run that reloads the conversation.
  Turn 3 asks for content that lived in part03 (compacted by then). Before
  Stage 1 the freeze map was per run: turn 2 and turn 3 could re-render the
  same tool result differently (the model watched its history change, the
  prompt cache missed). Now renderings are frozen per chat in the store. The
  observable contract: the turn-3 answer is the real id or an honest re-read,
  never a claim that the file is empty or unreadable.
target_component: prompt

setup:
  - |
    python3 - <<'PYEOF'
    import os, random
    words = ["CINNABAR","BASALT","LARKSPUR","OBSIDIAN","MARIGOLD","GALENA",
             "SORREL","FELDSPAR","JUNIPER","CORUNDUM","YARROW","PUMICE",
             "VERVAIN","SCHIST"]
    base = "/tmp/nebo-longsession-frozen/logs"
    os.makedirs(base, exist_ok=True)
    rng = random.Random(90210)
    for i in range(1, 15):
        lines = ["# synthetic worker log — nebo longsession fixture (no real data)",
                 f"BATCH-ID: FZ-{i:02d}-{words[i-1]}",
                 f"# part {i:02d} of 14"]
        for n in range(460):
            lines.append(
                f"2026-09-02T{n//60%24:02d}:{n%60:02d}:{rng.randrange(60):02d}Z "
                f"svc=queue-sim worker=w{i:02d} event=heartbeat seq={n:05d} "
                f"latency_ms={rng.randrange(2,900):03d} depth={rng.randrange(0,50):02d}")
        open(f"{base}/part{i:02d}.txt","w").write("\n".join(lines)+"\n")
    print("wrote 14 parts")
    PYEOF
teardown:
  - "rm -rf /tmp/nebo-longsession-frozen"

conversation:
  - role: user
    content: "Read each of these fourteen files COMPLETELY, one file read per file, in order: /tmp/nebo-longsession-frozen/logs/part01.txt through part14.txt. Each has a 'BATCH-ID:' line near the top. When done, list the fourteen BATCH-IDs in order. One read per file, no shell concatenation."
  - role: user
    content: "Quick one: what is 17 times 3?"
  - role: user
    content: "Back to the logs: what exactly was the BATCH-ID line in part03.txt? Reply with the exact id. If you genuinely no longer have it, re-read that one file rather than guessing."

tool_config:
  os:
    enabled: true

prompt_assertions:
  first_call:
    - id: reads-happened
      text: "The trace contains an os file read of part01.txt and of part14.txt"
      severity: critical
      check: { tool: [os, system], arg: path, contains: "part14.txt" }
  recovery:
    - id: turn2-answered
      text: "Turn 2 is answered directly (51) with no file reads"
      severity: important
    - id: turn3-real-content
      text: "The turn-3 answer for part03.txt is exactly FZ-03-LARKSPUR, either recalled or via one honest re-read; any other id is a fabrication and fails"
      severity: critical
    - id: no-cannot-read-claim
      text: "The model never says a file is empty, unreadable, or that its tools are broken"
      severity: critical

ideal_behavior:
  tool_calls: 15
  total_tokens: 220000
  narrative: |
    14 reads → list ids → "51" → recall FZ-03-LARKSPUR (or one re-read of part03).
