id: server-a-missing-need-reaches-the-owner-once
name: "A missing need reaches the owner once"
description: |
  An employee's missing need reaches the owner once, from each place that
  knows it, and the item opens the one place that fixes it; nothing is
  installed or connected for the owner. Pre-flight holds the fires of a
  binding whose capability no installed plugin provides: the owner is told the
  first, never the fires after it, nor a watch trigger's restart; a plugin that
  provides it resolves the item at the next fire, and its loss is told once
  more. A run blocked by a tool refusing for want of an account is told from
  what the tool named, as data (the refusal's words are never read): a repeat,
  a failure, a quiet exit or a run that completes while the account is still
  missing are quiet; another duty blocked on the same account joins the same
  item, which lists both duties; connecting the account resolves it, and
  losing it again is told once more. A run whose own words say the duty cannot
  be done is judged in the heartbeat triage call: when the decision says a
  need is missing the fire is held and the duty joins the item that already
  tells that need; when the decision is silent the fire runs and nothing is
  told; a need nobody can name is its own item.
target_component: engine
proof: engine::proof::server::a_missing_need_reaches_the_owner_once
