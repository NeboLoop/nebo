id: server-a-missing-need-reaches-the-owner-once
name: "A missing need reaches the owner once"
description: |
  An employee's missing need reaches the owner once, from each of the three
  places that know it, and the item opens the one place that fixes it; nothing
  is installed or connected for the owner. Pre-flight holds the fires of a
  binding whose plugin is missing: the owner is told the first, never the fires
  after it; a different need is told; a met need is forgotten, so its return is
  told again. A run blocked by a tool refusing for want of an account is told
  from what the tool named, as data (the refusal's words are never read): a
  repeat is quiet, a failure or a quiet exit in between changes nothing, each
  binding is told for itself, and a completed run means the need was met. A
  run whose own words say the duty cannot be done is judged in the heartbeat
  triage call: when the decision says a need is missing the fire is held and
  the owner told once; when the decision is silent the fire runs and nothing
  is told.
target_component: engine
proof: engine::proof::server::a_missing_need_reaches_the_owner_once
