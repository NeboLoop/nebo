id: server-the-webhook-door-routes-people-to-their-case-and-the-rest-to-a-plain-run
name: "The webhook door routes people to their case and the rest to a plain run"
description: |
  The hub's webhook door: a delivery to a case binding that names a person
  opens their case; the hub's redelivery of the same message is a duplicate; a
  second submission reaches the same case; a delivery that names nobody, or to
  a plain binding, is handed back to run as a plain webhook with the payload
  in the envelope; a missing binding is an error.
target_component: engine
