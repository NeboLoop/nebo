name: "UC56 — Cross-employee handoffs where one case moves between roles without losing history"
description: |
  uc56 — Cross-employee handoffs where one case moves between roles without
  losing history. The intake employee hands the case to the closer: the case
  keeps its id and history, the closer's binding takes the next message, the
  intake binding is refused as a conflict, and the turns show who worked it
  when.
