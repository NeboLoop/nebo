id: concurrency-a-429-slows-the-whole-bot-and-it-recovers
name: "A 429 slows the whole bot and it recovers"
description: |
  Eight sub-tasks fan out over eight model slots and Janus refuses the first
  wave of eight calls with a 429. The bot halves once for the whole wave,
  never runs all eight at once again until successes rebuild the pool, every
  sub-task still finishes, and the pool grows back to eight on its own.
target_component: engine
