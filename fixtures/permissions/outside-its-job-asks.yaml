id: outside-its-job-asks
name: "Case 4 — a capability outside the job asks, and 'Allow always' grows it"
description: |
  PRD-Permissions §4.4 case 4 / §7 (the five cases): "Outside its job: a
  capability the job doesn't include." Technical design §2.12.4: decided by
  code from the call's capability against the employee's capability allow
  rules; "Allow always adds the capability, permanently, to the job."
  This is the one PRD-Permissions case that used to be a flat, silent
  refusal (today's capability toggle: web off means web is simply denied).
  Automatic mode changes that to an ask that can grow the job — the point
  this fixture pins, and why it differs from
  `fixtures/turn/helper-cannot-exceed-parent.yaml` (a hard ceiling a helper
  can never cross, never an ask).
  The employee is hired for bookkeeping only (its job has no web
  capability) and is asked to look something up online. The right
  behaviour states plainly that web browsing isn't part of this job today
  and that it's checking with the owner, rather than a bare "I can't do
  that" with no path forward.
target_component: permissions

agent: "bookkeeper-{{tag}}"

setup:
  - "curl -sf -X POST ${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents -H 'Content-Type: application/json' -d '{\"blank\":true,\"name\":\"bookkeeper-{{tag}}\"}' > /dev/null"
  - "python3 -c \"import json,urllib.request as u; s='http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1'; ags=json.load(u.urlopen(s+'/agents'))['agents']; i=[a['id'] for a in ags if a.get('name')=='bookkeeper-{{tag}}'][0]; u.urlopen(u.Request(s+'/entity-config/agent/'+i, data=json.dumps({'permissions': {'web': False}}).encode(), headers={'Content-Type': 'application/json'}, method='PUT'))\""
teardown:
  - "python3 -c \"import json,urllib.request as u; s='http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1'; ags=json.load(u.urlopen(s+'/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name','').startswith('bookkeeper-{{tag}}')]; [u.urlopen(u.Request(s+'/entity-config/agent/'+i, method='DELETE')) for i in ids]; [u.urlopen(u.Request(s+'/agents/'+i, method='DELETE')) for i in ids]\""

conversation:
  - role: user
    content: "Look up Example Supplies' current VAT rate on their website and update our records."
  - role: user
    content: "Allow always — go ahead and add web lookups to your job."
  - role: user
    content: "Now look up their current VAT rate again."

tool_config:
  search_web:
    enabled: true
  fetch_url:
    enabled: true

prompt_assertions:
  first_call:
    - id: names-it-as-outside-the-job
      text: "The reply tells the owner that browsing the web isn't part of this job today and that it's checking with them, rather than a bare refusal with no explanation"
      severity: critical
      check:
        reply_matches: "(?i)(not part of (my|its|this) job|outside (my|its) job|isn'?t something i can do (today|yet)|waiting for (you|the owner) to allow|need(s)? your (approval|ok))"
  recovery:
    - id: allow-always-grows-the-job-and-the-second-lookup-succeeds
      text: "After the owner says 'Allow always', the second, identical lookup request runs without asking again — the capability was actually added to the job, not answered once and forgotten"
      severity: critical
      check: { tool: ["fetch_url", "search_web"] }
  cost:
    - id: bounded
      text: "At most 5 tool calls across all three turns"
      severity: important
      check: { max_tool_calls: 5 }

ideal_behavior:
  tool_calls: 1
  total_tokens: 2500
  narrative: |
    Turn one: no successful web call; the reply says web isn't part of the
    job yet and asks. Turn two: the owner's "Allow always" is acknowledged.
    Turn three: the same lookup now runs with no further ask.
