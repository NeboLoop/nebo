id: reply-in-thread-does-not-ask
name: "Negative — a reply inside an existing thread never asks"
description: |
  PRD-Permissions §4.4 case 2's own carve-out / §7 (the five cases,
  negative): "Replies inside an existing thread, and messages to people it
  already works with, don't ask." Technical design §2.12.4: "Replies inside
  an existing thread and messages to people the employee already works with
  don't ask. employee_counterparties is written by its sends and by inbound
  messages routed to it." Listed in WP2.16 explicitly as the negative
  counterpart to `first-message-to-new-recipient-asks.yaml` — case 2 must
  fire on a genuinely new recipient and must NOT fire on a reply in an
  existing thread, or Automatic mode adds an ask on every reply and the
  PRD-Permissions §6 target ("near zero asks per employee per day") is
  unreachable.
  Setup delivers the customer's text the way an outside system's message
  reaches an employee: through the hub's webhook door (POST to the hook's
  URL with its key) into the employee's case binding, keyed by phone, which
  routes it through `route_signal` and records the sender as someone this
  employee works with. It waits until the case is open. The owner then asks
  for a reply. The right behaviour is to send the reply immediately, with no
  ask and no park, because the customer is already in this employee's
  thread. Needs the server connected to NeboAI (the gate's harness bot).
target_component: permissions

agent: "customer-care-{{tag}}"

setup:
  - |
    python3 - <<'PY'
    import json, os, time, urllib.request as u
    s = 'http://' + os.environ.get('NEBO_TEST_SERVER', 'localhost:27895') + '/api/v1'
    def call(method, url, body=None, headers=None):
        req = u.Request(url, data=None if body is None else json.dumps(body).encode(), method=method,
                        headers={'Content-Type': 'application/json', **(headers or {})})
        with u.urlopen(req, timeout=30) as r:
            raw = r.read()
        return json.loads(raw) if raw.strip() else {}
    name = 'customer-care-{{tag}}'
    md = '---\nname: %s\ndescription: Answers customers who text in.\n---\n\n# %s\n' % (name, name)
    texts = {'trigger': {'type': 'event', 'sources': [name + '.texts']},
             'case': {'key': 'phone', 'type': 'support'},
             'activities': [{'id': 'note', 'type': 'custom',
                             'intent': 'A customer texted in. Take no action; the owner decides the reply.'}]}
    aid = call('POST', s + '/agents', {'agentMd': md, 'name': name, 'agentJson': {'workflows': {'texts': texts}}})['agent']['id']
    call('POST', s + '/agents/%s/activate' % aid, {})
    call('PUT', s + '/agents/%s' % aid, {'loopExposed': True})
    hook = None
    for _ in range(60):
        try:
            hook = call('POST', s + '/agents/%s/webhooks' % aid, {'label': 'texts', 'workflowName': 'texts'})
            break
        except Exception:
            time.sleep(2)
    if not hook:
        raise SystemExit('the employee never registered on NeboAI, so no webhook could be made')
    call('POST', hook['url'], {'phone': '+1-555-0198', 'text': 'Hi, did my order ship yet?'},
         {'Authorization': 'Bearer ' + hook['key']})
    for _ in range(60):
        if call('GET', s + '/cases?agent=%s' % aid).get('cases'):
            break
        time.sleep(1)
    else:
        raise SystemExit('the inbound text never reached the case')
    PY
teardown:
  - "python3 -c \"import json,urllib.request as u; s='http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1'; ags=json.load(u.urlopen(s+'/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name','').startswith('customer-care-{{tag}}')]; [u.urlopen(u.Request(s+'/agents/'+i+'/webhooks/'+h['id'], method='DELETE')) for i in ids for h in json.load(u.urlopen(s+'/agents/'+i+'/webhooks'))['endpoints']]; [u.urlopen(u.Request(s+'/agents/'+i, method='DELETE')) for i in ids]\""

conversation:
  - role: user
    content: "A customer texted us from +1-555-0198 asking whether their order shipped yet. This is the same number that texted in about a return last month — we've replied to them before."
  - role: user
    content: "Reply and tell them it shipped this morning with tracking number 1Z999AA10123456784."

tool_config:
  message:
    enabled: true

prompt_assertions:
  recovery:
    - id: sends-without-asking
      text: "The employee replies to the customer's number with the shipping update, without asking the owner for permission first, because this is a reply in an existing thread"
      severity: critical
      check: { tool: ["sms_message_send"], arg: "to", contains: "555-0198" }
    - id: no-permission-language
      text: "The reply to the owner never frames this as needing approval or as waiting for an allow"
      severity: critical
      check:
        reply_not_matches: "(?i)(waiting for (you|the owner) to allow|need(s)? your (approval|ok)|can I (send|text)|should I (send|text)|new (number|recipient|contact))"
  cost:
    - id: bounded
      text: "At most 2 tool calls"
      severity: important
      check: { max_tool_calls: 2 }

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
  narrative: |
    One sms_message_send to +1-555-0198 with the tracking number, sent
    immediately — no ask, no park, because the thread already exists.
