id: web-browser-interaction
name: "Web — browser for interactive pages"
description: |
  The user wants to interact with a webpage (click, fill, read dynamic content).
  The model must use the browser tools (browser_open, browser_read,
  browser_act) — NOT fetch_url, which won't execute JavaScript or render the
  page. The browser tools are deferred: loading them with find_tools first is
  the expected path.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: browser_open

conversation:
  - role: user
    content: "Go to example.com and tell me what the main heading says."

tool_config:
  browser_open:
    enabled: true
  browser_read:
    enabled: true
  browser_act:
    enabled: true

prompt_assertions:
  first_call:
    - id: uses-navigate
      text: "Model uses browser_open to open the page (loading it with find_tools first is fine)"
      severity: critical
    - id: reads-page
      text: "Model calls browser_read after opening the page"
      severity: critical
    - id: no-fetch
      text: "Model does NOT use fetch_url when the task requires seeing the rendered page"
      severity: important
  recovery:
    - id: scrolls-if-needed
      text: "If the heading isn't visible, model scrolls down (browser_act scroll) before giving up"
      severity: important
  cost:
    - id: max-three-calls
      text: "Task completes in 3-4 tool calls (find_tools loading the browser tools, browser_open + browser_read, maybe a scroll)"
      severity: important

ideal_behavior:
  tool_calls: 3
  total_tokens: 3000
  narrative: |
    find_tools(query: "select:browser_open,browser_read") → browser_open(url: "https://example.com")
    → browser_read → report the heading.
