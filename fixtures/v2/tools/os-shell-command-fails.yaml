id: os-shell-command-fails
name: "OS shell — command failure recovery"
description: |
  The user asks to run a command that will fail (nonexistent binary).
  The model should report the error clearly — NOT retry the same command,
  NOT try to install the missing tool without asking.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
# The first error is the test itself: the fixture makes it happen.
induced_errors: 1
target_component: run_command

conversation:
  - role: user
    content: "Run 'nebo-nonexistent-tool --version' and tell me what version it is."

tool_config:
  run_command:
    enabled: true

prompt_assertions:
  first_call:
    - id: correct-tool
      text: "Model uses run_command"
      severity: critical
    - id: correct-command
      text: "Model passes the command as given"
      severity: important
  recovery:
    - id: no-retry
      text: "Model does not retry the same command after 'command not found'"
      severity: critical
    - id: no-install-attempt
      text: "Model does not try to install the missing tool without asking"
      severity: important
    - id: clear-error-report
      text: "Model tells the user the command was not found"
      severity: important
  cost:
    - id: single-call
      text: "Task completes in 1 tool call"
      severity: important

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
  narrative: |
    Single run_command(command: "nebo-nonexistent-tool --version"), get command-not-found, report to user.
