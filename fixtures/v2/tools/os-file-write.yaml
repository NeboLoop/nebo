id: os-file-write
name: "OS file write — correct tool routing"
description: |
  The user asks the agent to create a file with specific content. The model
  must use write_file(path, content) — NOT hallucinate "write" as a
  standalone tool or use echo/redirect through run_command.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: write_file

setup:
  - "rm -f {{scratch}}/nebo-test-output.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Create a file at {{scratch}}/nebo-test-output.txt with the content 'hello world'."

tool_config:
  write_file:
    enabled: true

prompt_assertions:
  first_call:
    - id: correct-tool-name
      text: "Model calls 'write_file', not 'write', 'bash', 'run_command' or 'os'"
      severity: critical
    - id: correct-resource
      text: "The call targets the file itself: write_file with a path, not a shell redirect through run_command"
      severity: critical
    - id: correct-action
      text: "Model writes the file (write_file), not edits or reads it"
      severity: critical
    - id: correct-path
      text: "Model passes the correct path '{{scratch}}/nebo-test-output.txt'"
      severity: critical
    - id: correct-content
      text: "Model passes content: 'hello world'"
      severity: critical
  recovery:
    - id: no-shell-fallback
      text: "Model does NOT use echo/redirect through run_command to write the file"
      severity: important
  cost:
    - id: write-then-verify
      text: "Task completes in no more than 2 tool calls: the write, and a read_file that verifies the file landed"
      severity: important
      check: { max_tool_calls: 2 }

ideal_behavior:
  tool_calls: 2
  total_tokens: 2000
  narrative: |
    Single write_file(path: "{{scratch}}/nebo-test-output.txt",
    content: "hello world") call, optionally a read_file to verify. Model
    confirms the file was created.
