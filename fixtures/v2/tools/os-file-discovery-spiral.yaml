id: os-file-discovery-spiral
name: "OS file discovery — no path-guessing spiral"
description: |
  The user asks the model to find a file that may not exist at an exact path.
  The model should try ONE reasonable approach (find, ls or rg through
  run_command), and if it fails, report clearly — NOT spiral through 5+
  retries with different path guesses.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: run_command

conversation:
  - role: user
    content: "Find me a screenshot from my Desktop"

tool_config:
  run_command:
    enabled: true

prompt_assertions:
  first_call:
    - id: uses-search-pattern
      text: "Model uses find (or ls/rg) with a pattern (e.g. *.png, screenshot*) — not a single hardcoded path guess"
      severity: critical
    - id: correct-tool
      text: "Model uses run_command with a find/ls/rg pattern search — not individual read_file path checks"
      severity: critical
  recovery:
    - id: no-path-guessing-spiral
      text: "Model does NOT guess paths repeatedly (e.g. trying Screenshot 2024-01-01.png, then Screenshot 2024-01-02.png, etc.)"
      severity: critical
    - id: max-three-calls
      text: "Model makes no more than 3 tool calls total"
      severity: critical
    - id: clear-report-on-miss
      text: "If no screenshots found, model reports that clearly instead of continuing to guess"
      severity: important
  cost:
    - id: efficient-discovery
      text: "Task completes in 1-2 tool calls"
      severity: important

ideal_behavior:
  tool_calls: 2
  total_tokens: 2000
  narrative: |
    Model issues a find for screenshot-like files on ~/Desktop
    (e.g. run_command(command: "find ~/Desktop -iname '*screenshot*'")).
    Reports results or absence clearly. No spiral.
