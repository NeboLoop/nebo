id: os-file-edit
name: "OS file edit — correct tool routing and params"
description: |
  The user asks the agent to replace text in an existing file. The model must
  use edit_file(path, old_string, new_string) — NOT hallucinate "edit" as a
  standalone tool or use sed through run_command. Ceiling raised
  from 3 to 4 (owner, 2026-09-21): isolated runs measured 3,3,3,2,4,3 against
  a ceiling of 3, and a control showed the extra call is the model verifying
  an unfamiliar opaque scratch path — the behavior this fixture wants.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: edit_file

setup:
  - "mkdir -p {{scratch}} && echo 'This is the draft version of the document.' > {{scratch}}/notes.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "In the file {{scratch}}/notes.txt, replace 'draft version' with 'final version'."

tool_config:
  edit_file:
    enabled: true

prompt_assertions:
  first_call:
    - id: correct-tool-name
      text: "Model calls 'read_file' or 'edit_file', not 'edit', 'bash', 'run_command' or 'os'"
      severity: critical
    - id: correct-resource
      text: "The calls target the file itself: read_file / edit_file with the file's path, not a shell command through run_command"
      severity: critical
    - id: correct-action
      text: "Model uses read_file or edit_file (read-then-edit is acceptable)"
      severity: critical
    - id: has-old-string
      text: "Model passes old_string: 'draft version' in the edit_file call"
      severity: critical
    - id: has-new-string
      text: "Model passes new_string: 'final version' in the edit_file call"
      severity: critical
  recovery:
    - id: no-sed-fallback
      text: "Model does NOT fall back to sed through run_command"
      severity: important
  cost:
    - id: max-four-calls
      text: "Task completes in no more than 4 tool calls: read, edit, a read that verifies the edit landed, and one extra call verifying the unfamiliar opaque scratch path"
      severity: critical
      check: { max_tool_calls: 4 }

ideal_behavior:
  tool_calls: 3
  total_tokens: 3500
  narrative: |
    read_file(path: "{{scratch}}/notes.txt"), then edit_file(path: "{{scratch}}/notes.txt",
    old_string: "draft version", new_string: "final version"), then a read_file
    that confirms the line now says "final version". Read, edit, verify is the
    shape the owner wants (2026-09-17); the verifying read is not waste.
