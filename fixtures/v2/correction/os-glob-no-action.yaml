id: correction-os-glob-no-action
name: "Correction - listing files by pattern is one call with no parse error"
description: |
  Replayed from a live run on 2026-09-05: the model called os with
  {glob: "*.md", path: "<dir>"} and no action and got "Failed to parse
  input: missing field `action`". The shape recurs (it is in the error-shape
  baseline). The os tool now infers the action from the fields when none is
  given, the way the agent tool does for a task update: glob or
  pattern+path is a glob, command is exec, path+content is write,
  path+old_string is edit, path alone is read. This fixture asks for the
  call in exactly that shape and pins a zero-error run. The rewrite has no
  glob: listing files goes through run_command (ls, find, rg --files), and
  the os tool takes no glob or path. On the rewrite the same request is met
  by listing *.md in the directory with run_command, with no error and no
  retry in a different shape, and the answer names the two .md files. The
  owner's message asks for the listing itself (the old one told the model
  to call os with glob and path, which on the rewrite asks for a call the
  os tool, desktop control only, cannot make).
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: run_command

setup:
  - "mkdir -p {{scratch}} && printf '# a\n' > {{scratch}}/alpha.md && printf '# b\n' > {{scratch}}/beta.md && printf 'x' > {{scratch}}/notes.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "List the *.md files in {{scratch}}, then tell me which ones are there."

tool_config:
  os:
    enabled: true
  run_command:
    enabled: true

prompt_assertions:
  first_call:
    - id: glob-call-shape
      text: "The first call lists *.md under {{scratch}} with run_command (ls, find or rg --files naming that directory)"
      severity: critical
      check: { first_call: true, tool: run_command, arg: command, matches: "/tmp/nebo-eval/[0-9a-f]{8}" }
  recovery:
    - id: no-tool-errors
      text: "Every call is accepted: no 'missing field action' or other parse error in any tool result"
      severity: critical
      check: { max_errors: 0, no_error_contains: ["missing field", "Failed to parse input"] }
    - id: one-call
      text: "One call is enough; the model does not retry with a different shape"
      severity: critical
      check: { max_tool_calls: 2 }
    - id: honest-listing
      text: "The final response names alpha.md and beta.md and does not name notes.txt"
      severity: critical

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
  narrative: |
    One run_command `ls {{scratch}}/*.md` (or find), the result lists alpha.md and beta.md,
    then one line naming them.
