id: correction-plugin-args-command
name: "Correction — a plugin command nested under args still runs"
description: |
  Replayed from the Auto-Categorizer's live thread on 2026-09-06. The model
  put the plugin command under args ({command: "doctor"}) and the tool turned the object into a "--command doctor" flag, so the binary
  answered "unexpected argument '--command'" twice before the model moved the
  command to the top level. plugin__quickbooks now lifts args.command into
  the command. plugin__quickbooks is deferred: find_tools loads it first.
  This fixture pins that a connection check runs clean on the first call.
  Setup installs quickbooks through the one install pathway (the store
  product's install code) and teardown removes it, the way
  correction-plugin-discover-installed does: without it the gate's fresh bot
  answered the doctor call with "Plugin 'quickbooks' not found. Available:
  none installed", which is the machine's fault and not the model's.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: plugin__quickbooks

setup:
  - "python3 -c \"import json,urllib.request as u; s='${NEBO_TEST_SERVER:-localhost:27895}'; ps=json.load(u.urlopen('http://'+s+'/api/v1/store/products?type=plugin&q=quickbooks'))['products']; p=[x for x in ps if x.get('slug')=='quickbooks'][0]; u.urlopen(u.Request('http://'+s+'/api/v1/store/products/'+p['id']+'/install', method='POST'), timeout=180).read()\""
teardown:
  - "curl -s -X DELETE http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/plugins/quickbooks > /dev/null"

conversation:
  - role: user
    content: "Check my QuickBooks connection with the plugin's doctor command and tell me what company it reaches."

tool_config:
  plugin__quickbooks:
    enabled: true

prompt_assertions:
  first_call:
    - id: doctor-first
      text: "The first call is plugin__quickbooks running doctor, or find_tools loading plugin__quickbooks right before it"
      severity: critical
      check: { first_call: true, tool: [find_tools, plugin__quickbooks] }
  recovery:
    - id: no-tool-errors
      text: "The run completes with no error result from any tool call: no 'unexpected argument' or 'exited with code' from plugin__quickbooks, or anything else"
      severity: critical
      check: { max_errors: 0 }
    - id: bounded
      text: "At most 4 tool calls (find_tools loading plugin__quickbooks counts as one)"
      severity: critical
      check: { max_tool_calls: 4 }
    - id: honest
      text: "The reply names the company (or says the plugin is not connected) only from the doctor result"
      severity: important

ideal_behavior:
  tool_calls: 2
  narrative: "find_tools(query: \"select:plugin__quickbooks\"), one doctor call, then a one-line answer naming the company and whether the API is reachable."
