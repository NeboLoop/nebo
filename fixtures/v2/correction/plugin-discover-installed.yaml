id: correction-plugin-discover-installed
name: "Correction: discover never offers to install what is installed"
description: |
  From the owner's live thread on 2026-09-05: the marketplace search built
  an install card for QuickBooks Online while that plugin was already
  installed, and the run parked on the card. Now find_plugins checks the
  plugin store before offering a card: an installed best match is reported
  as already installed (its tool is plugin__quickbooks, deferred and loaded
  with find_tools) and the run continues with the connect step. Setup
  installs quickbooks through the one install pathway (the store product's
  install code), so the machine this runs on really does have it, and
  teardown removes it again. It pins that no install card is ever offered.
  v2 (new harness): checks written for the rewrite's tools; see fixtures/v2/MAPPING.md.
target_component: find_plugins

setup:
  - "python3 -c \"import json,urllib.request as u; s='${NEBO_TEST_SERVER:-localhost:27895}'; ps=json.load(u.urlopen('http://'+s+'/api/v1/store/products?type=plugin&q=quickbooks'))['products']; p=[x for x in ps if x.get('slug')=='quickbooks'][0]; u.urlopen(u.Request('http://'+s+'/api/v1/store/products/'+p['id']+'/install', method='POST'), timeout=180).read()\""
teardown:
  - "curl -s -X DELETE http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/plugins/quickbooks > /dev/null"

conversation:
  - role: user
    content: "Let's create a quickbooks auto-categorization assistant."

tool_config:
  plugin__quickbooks:
    enabled: true
  find_plugins:
    enabled: true
  create_employee:
    enabled: true
  use_skill:
    enabled: true

prompt_assertions:
  recovery:
    - id: no-install-card
      text: "No tool result contains \"Install it on the card\"; no install_plugin ask is produced for a plugin that is already installed"
      severity: critical
    - id: says-installed
      text: "If find_plugins is called for quickbooks, its result says the plugin was already installed and points at plugin__quickbooks"
      severity: critical
    - id: no-first-call-misses
      text: "No call is rejected for its shape: no InputValidationError or no-such-tool error, no install card for the installed plugin, and no 'not found. Available' (the setup above failed to install). A verb past doctor answering 'No quickbooks account is connected' is the gate bot's state, not a miss — it has no merchant's OAuth grant and never will."
      severity: critical
      check:
        no_error_contains:
          - "InputValidationError"
          - "No such tool"
          - "Install it on the card"
          - "not found. Available"
    - id: bounded
      text: "At most 9 tool calls (find_tools loading plugin__quickbooks counts as one)"
      severity: important
      check: { max_tool_calls: 9 }
    - id: honest-summary
      text: "The final response does not tell the user to install QuickBooks; it proceeds with the assistant (asks what to categorize, reads the plugin's help, or creates the employee)"
      severity: important

ideal_behavior:
  tool_calls: 4
  narrative: "Confirm quickbooks is installed (plugin__quickbooks in the deferred-tool listing, or its help after find_tools loads it), then design or create the assistant; no install card, no install narration."
