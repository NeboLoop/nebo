id: goal-proposed-approved-and-checked
name: "An agreed goal is proposed from the owner's words, approved, and checked until met"
description: |
  The owner asks for an outcome with a checkable end state that takes many
  steps. On the turn controller the employee proposes it as the agreed goal
  (`suggest_goal`; the owner's own words stated the end state, so it may be
  set directly or through the approval card, which this harness approves),
  and the done check at the end of each stop judges the transcript against
  it: not met keeps the turn going, met ends it. The goal's condition
  follows the owner's request: it neither widens nor narrows it.
  Today there is no agreed goal; the objective is re-derived per message and
  auto-continue decides separately.
target_component: runner

setup:
  - |
    python3 - <<'PYEOF'
    import os
    base = "{{scratch}}/inbox"
    os.makedirs(base, exist_ok=True)
    msgs = [
        "A customer asks for a receipt for the March order.",
        "The cleaning service will come an hour late on Friday.",
        "A supplier sent a corrected invoice for last week.",
        "The team lunch moved to the Thai place on Main Street.",
        "A client wants to add two seats to their plan.",
        "The internet provider schedules maintenance on Sunday night.",
        "An applicant asked about the status of their interview.",
        "The fire extinguishers are due for inspection this month.",
    ]
    for i, m in enumerate(msgs, 1):
        open(f"{base}/msg-{i:02d}.txt", "w").write(m + "\n")
    PYEOF
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Every file in {{scratch}}/inbox needs a one-line summary in {{scratch}}/summaries.md, one line per file, each starting with the file name. There are eight files. Keep at it until all eight are done."

tool_config:
  read_file:
    enabled: true
  write_file:
    enabled: true
  edit_file:
    enabled: true

prompt_assertions:
  first_call:
    - id: goal-is-proposed
      text: "The employee proposes (or, from the owner's own words, sets) the agreed goal"
      severity: critical
      check: { tool: suggest_goal }
  recovery:
    - id: goal-follows-the-request
      text: "The goal's condition states the owner's end state — all eight inbox files summarized in summaries.md, one line each starting with the file name — without adding work (no replies drafted, no files moved) or dropping any of it"
      severity: critical
    - id: works-to-the-end
      text: "The job reaches the last file: msg-08 is read"
      severity: critical
      check: { tool: read_file, arg: path, contains: "msg-08" }
    - id: writes-the-summaries
      text: "summaries.md is written"
      severity: critical
      check: { tool: [write_file, edit_file], arg: path, contains: "summaries.md" }
    - id: stops-when-met
      text: "Once all eight lines are written the turn ends with a report; the employee does not keep going with work nobody asked for"
      severity: critical
  cost:
    - id: bounded
      text: "At most 22 calls: the goal, eight reads, their writes, a few spare"
      severity: important
      check: { max_tool_calls: 22 }

ideal_behavior:
  tool_calls: 17
  narrative: |
    suggest_goal("All eight files in inbox have a one-line summary in
    summaries.md, one line each starting with the file name"), approved;
    then read and write through msg-08; the done check finds it met and the
    turn ends: "All eight are summarized in summaries.md."
