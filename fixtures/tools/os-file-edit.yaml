id: os-file-edit
name: "OS file edit — correct tool routing and params"
description: |
  The user asks the agent to replace text in an existing file. The model must
  use os(resource: "file", action: "edit") with old_string and new_string —
  NOT hallucinate "edit" as a standalone tool or use shell sed.
target_component: os

setup:
  - "mkdir -p /tmp/nebo-test && echo 'This is the draft version of the document.' > /tmp/nebo-test/notes.txt"
teardown:
  - "rm -f /tmp/nebo-test/notes.txt"

conversation:
  - role: user
    content: "In the file /tmp/nebo-test/notes.txt, replace 'draft version' with 'final version'."

tool_config:
  os:
    enabled: true

prompt_assertions:
  first_call:
    - id: correct-tool-name
      text: "Model calls 'os', not 'edit' or 'bash'"
      severity: critical
    - id: correct-resource
      text: "The call targets the file resource: resource: 'file' given explicitly, or omitted with a file action (read/edit) that the os tool resolves to file"
      severity: critical
    - id: correct-action
      text: "Model uses action: 'read' or 'edit' (read-then-edit is acceptable)"
      severity: critical
    - id: has-old-string
      text: "Model passes old_string: 'draft version' in the edit call"
      severity: critical
    - id: has-new-string
      text: "Model passes new_string: 'final version' in the edit call"
      severity: critical
  recovery:
    - id: no-sed-fallback
      text: "Model does NOT fall back to shell sed command"
      severity: important
  cost:
    - id: max-three-calls
      text: "Task completes in no more than 3 tool calls: read, edit, and a read that verifies the edit landed"
      severity: critical
      check: { max_tool_calls: 3 }

ideal_behavior:
  tool_calls: 3
  total_tokens: 3500
  narrative: |
    os(resource: "file", action: "read"), then os(resource: "file", action: "edit",
    path: "/tmp/nebo-test/notes.txt", old_string: "draft version",
    new_string: "final version"), then a read that confirms the line now says
    "final version". Read, edit, verify is the shape the owner wants (2026-09-17);
    the verifying read is not waste.
