id: web-browser-interaction
name: "Web — browser for interactive pages"
description: |
  The user wants to see what a rendered page shows. The model must use the
  browser (browser_open, browser_read) — NOT fetch_url, which doesn't run
  JavaScript or render the page. The browser tools are deferred: loading them
  with find_tools first is the expected path.
target_component: browser_open

conversation:
  - role: user
    content: "Go to example.com and tell me what the main heading says."

tool_config:
  browser_open:
    enabled: true
  browser_read:
    enabled: true
  browser_act:
    enabled: true

prompt_assertions:
  first_call:
    - id: uses-browser-open
      text: "Model uses browser_open to open the page"
      check: { tool: browser_open, arg: url, contains: "example.com" }
      severity: critical
    - id: reads-page
      text: "Model reads the heading from what browser_open returned, or calls browser_read after opening"
      severity: critical
    - id: no-fetch
      text: "Model does NOT use fetch_url when the task asks for the rendered page"
      severity: important
  recovery:
    - id: scrolls-if-needed
      text: "If the heading isn't visible, model scrolls with browser_act before giving up"
      severity: important
  cost:
    - id: max-four-calls
      text: "Task completes in 2-4 tool calls (find_tools, browser_open, maybe browser_read or a scroll)"
      severity: important

ideal_behavior:
  tool_calls: 3
  total_tokens: 3000
  narrative: |
    find_tools(query: "select:browser_open,browser_read") → browser_open(url: "https://example.com")
    → browser_read → report the heading.
