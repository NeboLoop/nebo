id: agent-spawn-parallel-worktree
name: "Parallel edits in one repo — isolation: worktree, merged back"
description: |
  Two independent edits to the same git repo. The model starts two helpers
  in parallel (two delegate calls in one response) with isolation: "worktree"
  and each prompt naming the repo; each helper works in its own worktree; both
  land on the owner's branch; no nebo/* branch remains.
target_component: delegate

setup:
  - "rm -rf /tmp/nebo-test/wt && mkdir -p /tmp/nebo-test/wt && cd /tmp/nebo-test/wt && git init -q -b main && git config user.email t@t && git config user.name t && printf 'one\n' > a.txt && printf 'two\n' > b.txt && git add -A && git commit -q -m base"
teardown:
  - "rm -rf /tmp/nebo-test/wt"

conversation:
  - role: user
    content: "In the repo /tmp/nebo-test/wt, run two helpers in parallel with worktree isolation: one changes a.txt to say ONE, the other changes b.txt to say TWO. When both are merged back, tell me what the merge section said."

tool_config:
  os:
    enabled: true
  delegate:
    enabled: true

prompt_assertions:
  first_call:
    - id: parallel-isolated
      text: "The model starts two helpers with two delegate calls in one response, each with isolation: worktree"
      severity: critical
      check: { first_call: true, tool: delegate, arg: isolation, equals: worktree }
    - id: second-helper-isolated
      text: "The second call is also delegate with isolation: worktree (one helper per file)"
      severity: critical
      check: { call: 2, tool: delegate, arg: isolation, equals: worktree }
    - id: workspace-set
      text: "Each delegate prompt names the repo /tmp/nebo-test/wt"
      severity: important
      check: { tool: delegate, arg: prompt, contains: "/tmp/nebo-test/wt" }
  recovery:
    - id: both-merged
      text: "The reported merge section lists both helpers as merged"
      severity: critical
    - id: honest-report
      text: "The final answer reflects the merge section verbatim (merged / conflict), never a claim beyond it"
      severity: critical

ideal_behavior:
  tool_calls: 2
  total_tokens: 6000
  narrative: |
    Two delegate(isolation: worktree, prompt: "in /tmp/nebo-test/wt, edit a.txt / b.txt")
    calls in one response → report the Worktree merges section.
