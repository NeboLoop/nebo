id: read-file
name: "Read file — correct tool routing"
description: |
  The user asks the agent to read a file. The model must use
  read_file(path) — NOT hallucinate "read", "file", "bash", or fall back to
  run_command with cat. This is the highest-volume tool call in the system.
target_component: read_file

setup:
  - "echo 'hello from nebo config' > {{scratch}}/nebo-config.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Read the file at {{scratch}}/nebo-config.txt and tell me what it says."

tool_config:
  read_file:
    enabled: true
    response_budget:
      max_chars: 500
      rationale: "File contents should be returned concisely"

prompt_assertions:
  first_call:
    - id: correct-tool-name
      text: "Model calls 'read_file', not 'read', 'file', 'bash', 'run_command', or 'os'"
      severity: critical
      check: { first_call: true, tool: read_file }
    - id: correct-path
      text: "Model passes path: '{{scratch}}/nebo-config.txt' exactly"
      severity: critical
      check: { first_call: true, tool: read_file, arg: path, equals: "{{scratch}}/nebo-config.txt" }
  recovery:
    - id: no-shell-fallback
      text: "Model does NOT fall back to run_command(command: 'cat {{scratch}}/nebo-config.txt', description: ...) after a successful read_file"
      severity: important
  cost:
    - id: single-call
      text: "Task completes in exactly 1 tool call"
      severity: important

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
  narrative: |
    Single read_file(path: "{{scratch}}/nebo-config.txt") call.
    Model reads the response and reports the contents to the user.
