id: agent-spawn-background
name: "Helper in the background — delegate, then read_output"
description: |
  The user explicitly wants work started in the background while the
  conversation continues. delegate runs helpers in the background by default
  (the model is notified on completion), so the model must not pass
  background: false, and must be able to check on the helper with
  read_output — not block on it, not pretend it finished, not poll in a
  tight loop.
target_component: delegate

conversation:
  - role: user
    content: "Kick off a background research task summarizing this week's mortgage rate movements — don't wait for it. While that runs, tell me: what's a good subject line for a September open-house email? Then check whether the research has finished."

tool_config:
  delegate:
    enabled: true
  read_output:
    enabled: true
  search_web:
    enabled: true
  fetch_url:
    enabled: true

prompt_assertions:
  first_call:
    - id: background-spawn
      text: "Model calls delegate for the research task in the background (background omitted or true — never background: false)"
      severity: critical
      check: { first_call: true, tool: delegate }
  recovery:
    - id: answers-inline-question
      text: "Model answers the subject-line question itself without blocking on the background helper"
      severity: critical
    - id: checks-status
      text: "Model calls read_output with the helper's id to check the background helper"
      severity: critical
      check: { tool: read_output, arg: task_id, exists: true }
    - id: honest-about-state
      text: "Model reports the background helper's actual state from the read_output result — it never claims research results it has not received"
      severity: critical
    - id: no-tight-poll
      text: "Model does not call read_output more than twice"
      severity: important

ideal_behavior:
  tool_calls: 3
  total_tokens: 6000
  narrative: |
    delegate(description, prompt) in the background → answer the subject-line
    question directly → (find_tools select:read_output if needed) one
    read_output(task_id) check → honest report of where the background helper stands.
