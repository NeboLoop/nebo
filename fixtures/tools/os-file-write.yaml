id: os-file-write
name: "OS file write — correct tool routing"
description: |
  The user asks the agent to create a file with specific content. The model
  must use os(resource: "file", action: "write") — NOT hallucinate "write"
  as a standalone tool or use shell echo/redirect.
target_component: os

setup:
  - "rm -f {{scratch}}/nebo-test-output.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Create a file at {{scratch}}/nebo-test-output.txt with the content 'hello world'."

tool_config:
  os:
    enabled: true

prompt_assertions:
  first_call:
    - id: correct-tool-name
      text: "Model calls 'os', not 'write' or 'bash'"
      severity: critical
    - id: correct-resource
      text: "Model uses resource: 'file'"
      severity: critical
    - id: correct-action
      text: "Model uses action: 'write'"
      severity: critical
    - id: correct-path
      text: "Model passes the correct path '{{scratch}}/nebo-test-output.txt'"
      severity: critical
    - id: correct-content
      text: "Model passes content: 'hello world'"
      severity: critical
  recovery:
    - id: no-shell-fallback
      text: "Model does NOT use shell echo/redirect to write the file"
      severity: important
  cost:
    - id: write-then-verify
      text: "Task completes in no more than 2 tool calls: the write, and a read that verifies the file landed"
      severity: important
      check: { max_tool_calls: 2 }

ideal_behavior:
  tool_calls: 2
  total_tokens: 2000
  narrative: |
    Single os(resource: "file", action: "write", path: "{{scratch}}/nebo-test-output.txt",
    content: "hello world") call. Model confirms the file was created.
