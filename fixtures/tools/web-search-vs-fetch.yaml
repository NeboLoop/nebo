id: web-search-vs-fetch
name: "Web — search vs fetch routing"
description: |
  The user asks to look something up. The model must use search_web for
  discovery queries — NOT fetch_url with a guessed URL, NOT browser_open on a
  search engine with query params. search_web is deferred: loading it with
  find_tools first is the expected path.
target_component: search_web

conversation:
  - role: user
    content: "What's the weather in Austin, TX right now?"

tool_config:
  search_web:
    enabled: true
  fetch_url:
    enabled: true

prompt_assertions:
  first_call:
    - id: uses-search
      text: "Model's first web call (after loading it with find_tools) is search_web for the initial lookup"
      check: { tool: search_web }
      severity: critical
    - id: no-direct-url
      text: "Model does NOT open google.com/search?q=... or similar with browser_open or fetch_url"
      severity: critical
    - id: has-query
      text: "Model passes a reasonable search query about Austin TX weather in `queries`"
      check: { tool: search_web, arg: queries, matches: "(?i)austin" }
      severity: important
  recovery:
    - id: follows-results
      text: "If model needs more detail, it reads a search result with fetch_url rather than guessing a URL"
      severity: important
  cost:
    - id: max-four-calls
      text: "Task completes in 1-4 tool calls (find_tools to load search_web counts as one)"
      severity: important

ideal_behavior:
  tool_calls: 2
  total_tokens: 3000
  narrative: |
    find_tools(query: "select:search_web") → search_web(queries: ["weather Austin TX"])
    → read results → report.
