id: agent-spawn-parallel
name: "Helper batch — parallel independent research"
description: |
  Two independent research tasks. The delegate contract says independent
  pieces are several delegate calls in ONE response — one helper per task,
  running concurrently in the background, each reporting by notification.
  Serial delegation across turns or doing both itself wastes wall-clock.
target_component: delegate

conversation:
  - role: user
    content: "Research two things for me at the same time: (1) what CRM systems realtors most commonly use, and (2) what typical transaction-coordination fees look like in the US. Keep the two summaries separate."

tool_config:
  delegate:
    enabled: true
  search_web:
    enabled: true
  fetch_url:
    enabled: true

prompt_assertions:
  first_call:
    - id: parallel-action
      text: "Model starts one helper per topic with delegate, both delegate calls in one response"
      severity: critical
      check: { first_call: true, tool: delegate }
    - id: two-tasks
      text: "There are exactly 2 delegate calls, one per research topic"
      severity: critical
      check: { call: 2, tool: delegate }
    - id: born-blind-web
      text: "Each delegate prompt states its whole topic on its own (CRM systems for one, transaction-coordination fees for the other) and what to report back"
      severity: critical
  recovery:
    - id: two-summaries
      text: "Final answer contains two clearly separated summaries matching the two requests"
      severity: important

ideal_behavior:
  tool_calls: 2
  total_tokens: 8000
  narrative: |
    Two delegate calls in one response — delegate(description: "research realtor CRMs",
    prompt: "...CRM...") and delegate(description: "research TC fees",
    prompt: "...fees...") — then a two-part answer once both helpers report.
