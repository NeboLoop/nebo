id: sc134-a-projects-card-is-handed-out-and-closed-in-its-thread
name: "SC134 — A project's card is handed out and closed in its thread"
description: |
  Teams, projects and threads (2026-10-16): a project's step handed to a
  member is a card. The lead's line in the project's thread names the
  member, the work and when it counts as done; the member works it as its
  own case, and when the case closes its summary is the next line. The card
  is the hand-off, carrying the project and its team; the team's own thread
  stays as it was.
target_component: staffed-company
