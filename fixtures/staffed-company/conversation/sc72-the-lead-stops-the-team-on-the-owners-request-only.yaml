id: sc72-the-lead-stops-the-team-on-the-owners-request-only
name: "SC72 — The lead stops the team on the owner's request, never on its own"
description: |
  When the owner asks the lead to stop everyone, his post carries his authority and the lead's
  stop_team stops every other member's work in the team. A lead's stop that serves no request of
  the owner's is refused, and so is a member's.
