name: "SC61 — The lead passes the owner's request to a linked teammate with his authority"
description: |
  The lead names a linked teammate in its reply to the owner's team post. The linked
  teammate's turn serves the owner's request: Nebo runs it on the owner's own surface with no
  colleague's audience, its thread serves the owner's post (whatever it passes on is his
  request too), the lead's words stay the lead's, and its runtime answers into the team.
