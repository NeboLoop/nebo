id: sc65-a-question-back-to-the-lead-is-the-members-answer
name: "SC65 — A question back to the lead is the member's answer"
description: |
  A member the lead asks may ask the lead one question back: that is its answer. The lead
  hears it as an answer, never as a new ask, answers the owner once, and the member is not
  asked again.
