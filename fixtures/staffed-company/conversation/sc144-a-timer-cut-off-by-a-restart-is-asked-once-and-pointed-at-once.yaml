id: sc144-a-timer-cut-off-by-a-restart-is-asked-once-and-pointed-at-once
name: "SC144 — A timer cut off by a restart is asked once and pointed at once"
description: |
  A one-shot fire cut off by a restart after its request reached the owner's conversation, mid-answer, is queued again by the boot sweep; it does not run again, the conversation answers the request the dead turn left (its half-said first line is not the answer), and the Inbox points at that answer exactly once.
