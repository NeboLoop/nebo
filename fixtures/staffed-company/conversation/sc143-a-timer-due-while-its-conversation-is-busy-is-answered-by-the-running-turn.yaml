id: sc143-a-timer-due-while-its-conversation-is-busy-is-answered-by-the-running-turn
name: "SC143 — A timer due while its conversation is busy is answered by the running turn"
description: |
  A one-shot that comes due while the owner's conversation has a turn running joins that turn, which answers it in the conversation; the Inbox still points at that answer, by the same rule as a timer that ran a turn of its own.
