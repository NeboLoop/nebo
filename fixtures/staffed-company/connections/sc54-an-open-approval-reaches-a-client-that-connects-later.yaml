id: sc54-an-open-approval-reaches-a-client-that-connects-later
name: "SC54 — An open approval reaches a client that connects later"
description: |
  An approval card still open is replayed to a client that connects later,
  with the origin it was asked under, so a phone that was in the background
  when its run suggested a goal shows the card when it returns. The first
  answer anywhere broadcasts approval_resolved and the card is replayed no
  more.
target_component: staffed-company
