id: sc54-an-open-approval-outlives-its-turn-and-reaches-a-client-that-connects-later
name: "SC54 — An open approval outlives its turn and reaches a client that connects later"
description: |
  A goal suggested through the real suggest_goal tool stays open after its
  turn ends (finish_turn), because its answer can still be given; a client
  that connects later is shown the card with the origin it was asked under.
  The owner's decision broadcasts approval_resolved and the card is shown no
  more; a card whose waiter went away has expired and is not shown.
target_component: staffed-company
