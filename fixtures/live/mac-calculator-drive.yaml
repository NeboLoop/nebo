id: live-mac-calculator-drive
name: "Computer control — drive Calculator by ref and read the result"
description: |
  LIVE, macOS only, not in any suite: needs a logged-in desktop session and
  Accessibility granted to the Nebo that serves --server. Run it on the
  Stadium mini (see docs/sme/COMPUTER_CONTROL_SME.md). The model must observe
  Calculator, press 7, +, 8, = by ref through accessibility, and report the
  display. The checks pin the pathway: a capture happens before any click, the
  presses go by ref, and the final reply reads 15. A prologue of launch /
  list / activate is allowed — that is how nebo-1 gets there.
target_component: os
setup:
  - "open -a Calculator; sleep 2"
teardown:
  - "pkill -x Calculator"

conversation:
  - role: user
    content: "Using the computer control tools on this Mac, capture the Calculator app, then press 7, +, 8 and = by clicking the buttons by ref, and tell me what the display shows afterwards. Do not use the keyboard or pixel coordinates."

tool_config:
  os:
    enabled: true

prompt_assertions:
  recovery:
    - id: captures-before-clicking
      text: "A capture (see) happens before the first click"
      severity: critical
    - id: presses-by-ref
      text: "Every click carries a ref and its result says it was pressed via accessibility; none is by pixel coordinate"
      severity: critical
    - id: reports-15
      text: "The final reply says the display shows 15"
      severity: critical
  cost:
    - id: bounded
      text: "At most 12 tool calls (prologue, one capture, four presses, one look, slack)"
      severity: important
      check: { max_tool_calls: 12 }

ideal_behavior:
  tool_calls: 5
  narrative: |
    os(capture see Calculator) → click ref "7" → click ref "+" (Add) → click ref "8"
    → click ref "=" (Equals); each press returns the window; the last shows 15.
