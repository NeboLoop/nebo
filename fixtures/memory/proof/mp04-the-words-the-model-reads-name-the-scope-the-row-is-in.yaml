name: "MP04 — The words the model reads name the scope the row is in"
description: |
  "Saved to local memory" only for a row in the local scope, "Saved to your private memory" only
  for a row in the employee's own; a run the owner did not start (a coworker's message, a workflow)
  is refused local memory in words that say so, and nothing lands.
