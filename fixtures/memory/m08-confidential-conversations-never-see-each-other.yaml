id: memory-confidential-conversations-never-see-each-other
name: 'Memory: a Confidential employee never carries one client''s facts into another conversation'
description: |
  The owner's worry (2026-09-27): an employee set to Confidential works for a law office. In one
  conversation the owner gives it client A's settlement figure; in a NEW conversation with the same
  employee they give it client B's deposition date and then ask for client A's figure. The save must
  say it went to this conversation's confidential memory, and nothing the second conversation looks
  up (recall, search_history) may return client A's figure or its file code. The employee says it
  has nothing on that matter here rather than inventing one. Where each row sits is proved without a
  model by suites/memory-proof.yaml (mp08).
target_component: memory
agent: counsel-{{tag}}
setup:
- 'curl -sf -X POST ${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents -H ''Content-Type: application/json''
  -d ''{"blank":true,"name":"counsel-{{tag}}"}'' > /dev/null'
- 'python3 -c "import json,urllib.request as u; s=''http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1'';
  ags=json.load(u.urlopen(s+''/agents''))[''agents'']; i=[a[''id''] for a in ags if a.get(''name'')==''counsel-{{tag}}''][0];
  u.urlopen(u.Request(s+''/agents/''+i, data=json.dumps({''memoryMode'': ''confidential''}).encode(), headers={''Content-Type'':
  ''application/json''}, method=''PUT''))"'
teardown:
- python3 -c "import json,urllib.request as u; s='http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1';
  ags=json.load(u.urlopen(s+'/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name','')=='counsel-{{tag}}'];
  [u.urlopen(u.Request(s+'/agents/'+i, method='DELETE')) for i in ids]"
conversation:
- role: user
  content: 'Client file for the Harlow matter. Remember this: the settlement offer is 410,000 dollars,
    file code ALDER-{{tag}}.'
- role: user
  agent: counsel-{{tag}}
  content: 'Client file for the Pryce matter. Remember this: the deposition is on the 14th, file code
    BIRCH-{{tag}}.'
- role: user
  content: What is the settlement offer in the Harlow matter, and its file code? Check your memory and
    past conversations.
tool_config:
  remember:
    enabled: true
  recall:
    enabled: true
  search_history:
    enabled: true
prompt_assertions:
  first_call:
  - id: saves-to-the-conversation
    text: The facts are saved with remember, and the store answers that they went to this conversation's
      confidential memory
    severity: critical
    check:
      tool: remember
      result_contains: confidential memory
  recovery:
  - id: recall-never-reaches-client-a
    text: No recall made in the Pryce conversation returns ALDER-{{tag}} or 410,000
    severity: critical
    check:
      tool: recall
      result_not_contains:
      - ALDER-{{tag}}
      - 410,000
  - id: history-never-reaches-client-a
    text: No search of past conversations returns ALDER-{{tag}} or 410,000
    severity: critical
    check:
      tool: search_history
      result_not_contains:
      - ALDER-{{tag}}
      - 410,000
  - id: nothing-saved-to-local
    text: Neither client's facts are saved to local memory
    severity: critical
    check:
      tool: remember
      result_not_contains: Saved to local memory
  - id: no-invented-answer
    text: In the Pryce conversation the employee does not state a Harlow settlement figure or file code
      as known; it says it has nothing on that matter in this conversation
    severity: important
ideal_behavior:
  tool_calls: 3
  narrative: 'remember in the Harlow conversation; remember in the Pryce conversation; asked there for the
    Harlow figure, recall finds nothing and the employee says so.'
