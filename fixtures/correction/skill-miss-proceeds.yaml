id: correction-skill-miss-proceeds
name: "Correction — no matching skill is not a missing capability"
description: |
  The user names a skill that is not installed for a task the built-in tools
  can do. The skill listing doesn't name it; a use_skill or find_skills call
  says no such skill is installed. The model must proceed (or ask a
  clarifying question), not declare the capability unavailable.
target_component: use_skill

setup:
  - "mkdir -p {{scratch}} && printf 'Q1 revenue 120\nQ2 revenue 150\n' > {{scratch}}/revenue.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Use the quarterly-summary skill to total the revenue in {{scratch}}/revenue.txt."

tool_config:
  use_skill:
    enabled: true
  find_skills:
    enabled: true
  read_file:
    enabled: true

prompt_assertions:
  recovery:
    - id: no-capability-denial
      text: "Model does NOT tell the user the task cannot be done or that the capability is unavailable"
      severity: critical
    - id: proceeds-with-builtins
      text: "After finding no such skill, the model reads the file with read_file and totals it (270), or asks one clarifying question and then does so"
      severity: critical
    - id: mentions-skill-honestly
      text: "Model may mention that no 'quarterly-summary' skill is installed, but does so in one sentence and still delivers the total"
      severity: important
  cost:
    - id: bounded
      text: "At most 4 tool calls"
      severity: important
      check: { max_tool_calls: 4 }

ideal_behavior:
  tool_calls: 2
  total_tokens: 2500
  narrative: |
    The listing has no quarterly-summary (at most one use_skill or
    find_skills miss), then read_file, then "270. There is no
    quarterly-summary skill installed, so I read the file directly."
