id: correction-glob-floor
name: "Correction — a truncated listing is a floor, not a count"
description: |
  150 files exist. There is no glob tool any more: finding files goes
  through run_command (find, ls, rg --files). Asked for the exact count, the
  model must count them (find | wc -l, ls | wc -l) and never answer a floor
  such as 100 or 101 taken from a clipped or partial listing.
target_component: run_command

setup:
  - "mkdir -p {{scratch}}/many && cd {{scratch}}/many && for i in $(seq 1 150); do : > f$i.txt; done"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Exactly how many .txt files are in {{scratch}}/many? I need the precise number."

tool_config:
  run_command:
    enabled: true

prompt_assertions:
  first_call:
    - id: counts-with-run-command
      text: "The first call is run_command with a find, ls, or rg command over {{scratch}}/many"
      severity: important
      check: { first_call: true, tool: run_command, arg: command, matches: "\\b(find|ls|rg)\\b" }
  recovery:
    - id: not-the-floor
      text: "Model does not report 100 or 101 as the count"
      severity: critical
    - id: exact-count
      text: "Model reports 150"
      severity: critical
    - id: reads-the-cap
      text: "The model counts with run_command (find | wc -l, ls | wc -l, or rg --files | wc -l) rather than eyeballing a listing; if a listing came back clipped, it counted another way instead of trusting it"
      severity: important
  cost:
    - id: bounded
      text: "At most 3 tool calls"
      severity: important
      check: { max_tool_calls: 3 }

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
  narrative: |
    One run_command `ls {{scratch}}/many/*.txt | wc -l` (or find | wc -l) and the
    answer 150.
