id: correction-unknown-file-action
name: "Correction — appending with no append mode keeps the file and finishes the job"
description: |
  Appending to a file tempts a mode that does not exist: write_file takes
  path and content and replaces the file, it has no append. A call with an
  invented parameter comes back as an input error that names the
  parameters that exist. The model must append a valid way (edit_file
  anchored on the last line, run_command `printf 'gamma\n' >> file`, or a
  read then a write_file of the whole content), never clobber the file with
  write_file(content: "gamma"), and finish the job without looping on a
  refused shape or giving up.
target_component: write_file

setup:
  - "mkdir -p {{scratch}} && printf 'alpha\nbeta\n' > {{scratch}}/notes.txt"
teardown:
  - "rm -rf {{scratch}}"

conversation:
  - role: user
    content: "Append a line that says 'gamma' to the end of {{scratch}}/notes.txt, then show me the whole file."

tool_config:
  read_file:
    enabled: true
  edit_file:
    enabled: true
  write_file:
    enabled: true
  run_command:
    enabled: true

prompt_assertions:
  first_call:
    - id: uses-file-or-command-tool
      text: "Model's first call is one of the file tools or run_command"
      severity: critical
      check: { first_call: true, tool: [read_file, edit_file, write_file, run_command] }
  recovery:
    - id: corrects-after-refusal
      text: "If a call is refused (an invented parameter such as append, or an edit anchor that does not match), the very next call uses a valid way (edit_file, write_file with the whole content, or a run_command append) instead of repeating the refused shape; no write_file ever replaces the file with just 'gamma'"
      severity: critical
    - id: job-finished
      text: "The file ends up with gamma on its own last line and the model shows all three lines"
      severity: critical
    - id: no-abandon
      text: "Model does not tell the user it cannot append to files"
      severity: critical
  cost:
    - id: bounded
      text: "At most 4 tool calls"
      severity: important
      check: { max_tool_calls: 4 }

ideal_behavior:
  tool_calls: 2
  total_tokens: 2500
  narrative: |
    One run_command append (or edit_file anchored on beta), one read_file
    (or cat in the same command), then the three lines.
