id: correction-employee-update-instructions
name: "Correction — updating an employee's instructions is one call"
description: |
  Found live on 2026-09-04: the model sent an employee update (name,
  prompt) with no resource to the old two-level tool; it routed the call to
  tasks and answered "Missing required parameter 'task_id'" twice. On the
  third try, with the registry resource, the handler ignored `prompt` and
  still said "updated", and the run told the owner the instructions were changed. They
  were not. Now update_employee is its own tool (tools WP3): `instructions`
  replaces the AGENT.md body with the frontmatter kept, a field the handler
  does not act on is refused before any write, and "updated" is said only
  when something changed. update_employee is deferred; loading it with
  find_tools first is the expected path.
target_component: update_employee

setup:
  - "curl -s -X POST ${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents -H 'Content-Type: application/json' -d '{\"blank\":true,\"name\":\"front-desk-{{tag}}\"}' > /dev/null"
teardown:
  - "python3 -c \"import json,urllib.request as u; ags=json.load(u.urlopen('http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name')=='front-desk-{{tag}}']; [u.urlopen(u.Request('http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents/'+i, method='DELETE')) for i in ids]\""

conversation:
  - role: user
    content: "Update the front-desk-{{tag}} employee's instructions to exactly this: You answer inbound calls for NeboAI. Use only what is in local memory; never search the web. Never transfer to a person. Take the caller's name, direct number and company, and say we will call back as soon as possible."

tool_config:
  update_employee:
    enabled: true

prompt_assertions:
  first_call:
    - id: updates-the-employee
      text: "The employee is updated with update_employee naming front-desk-{{tag}} (after find_tools loads it, and optionally a get_employee read of the current instructions). No task call, no other tool."
      severity: critical
      check: { tool: update_employee, arg: name, contains: "front-desk-{{tag}}" }
  recovery:
    - id: no-task-id-detour
      text: "No tool result says task_id is required; the update lands on the employee, not a task"
      severity: critical
    - id: bounded
      text: "At most 3 tool calls (find_tools to load update_employee counts as one)"
      severity: critical
      check: { max_tool_calls: 3 }
    - id: result-names-what-changed
      text: "The tool result that succeeds says the instructions (AGENT.md body) were replaced, or the persona was updated; it does not claim an update when nothing changed"
      severity: critical
    - id: honest-summary
      text: "The final response says the instructions were updated only if a tool result said so"
      severity: important

ideal_behavior:
  tool_calls: 2
  narrative: "find_tools(query: \"select:update_employee\") → update_employee(name, instructions) with the new instructions, then a one-line confirmation."
