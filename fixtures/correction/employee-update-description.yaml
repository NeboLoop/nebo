id: correction-employee-update-description
name: "Correction: updating an employee's description is one update_employee call"
description: |
  From the routing audit of 2026-09-05 (class C): an update of an employee
  carrying name and description but no resource was routed to tasks by the
  old two-level tool, because `description` is a task field too, and
  answered "Missing required parameter 'task_id'". The employee tools have
  one purpose each now (tools WP3): update_employee changes an employee and
  nothing else. This fixture pins it: the description changes in one
  accepted call, no task detour, no tool error of any kind. update_employee
  is deferred, so loading it with find_tools first is the expected path.
target_component: update_employee

setup:
  - "curl -s -X POST ${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents -H 'Content-Type: application/json' -d '{\"blank\":true,\"name\":\"front-desk-{{tag}}\"}' > /dev/null"
teardown:
  - "python3 -c \"import json,urllib.request as u; ags=json.load(u.urlopen('http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name')=='front-desk-{{tag}}']; [u.urlopen(u.Request('http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents/'+i, method='DELETE')) for i in ids]\""

conversation:
  - role: user
    content: "Update the front-desk-{{tag}} employee's description to exactly this: Answers inbound calls for NeboAI and takes messages for the team."

tool_config:
  update_employee:
    enabled: true

prompt_assertions:
  first_call:
    - id: updates-the-employee
      text: "The employee is updated with update_employee naming front-desk-{{tag}} (after find_tools loads it, and optionally a get_employee read). No task call."
      severity: critical
      check: { tool: update_employee, arg: name, contains: "front-desk-{{tag}}" }
  recovery:
    - id: no-tool-errors
      text: "Every call is accepted: no missing-parameter, unknown-action, or not-found error in any tool result, and nothing says task_id is required"
      severity: critical
      check: { max_errors: 0 }
    - id: bounded
      text: "At most 3 tool calls (find_tools to load update_employee counts as one)"
      severity: critical
      check: { max_tool_calls: 3 }
    - id: description-lands
      text: "A tool result says the employee's description was updated"
      severity: critical
    - id: honest-summary
      text: "The final response says the description was updated only because a tool result said so"
      severity: important

ideal_behavior:
  tool_calls: 2
  narrative: "find_tools(query: \"select:update_employee\") → update_employee(name, description), then a one-line confirmation."
