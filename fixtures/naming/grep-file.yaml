id: naming-grep-file
name: "Naming test — search file contents"
description: |
  Baseline task: search for a pattern in files. Measures first-call tool naming accuracy.
target_component: run_command

setup:
  - "mkdir -p /tmp/nebo-project && printf '// TODO fix this\n' > /tmp/nebo-project/x.txt"
teardown:
  - "rm -rf /tmp/nebo-project"

conversation:
  - role: user
    content: "Search for the word 'TODO' in all files under /tmp/nebo-project/"

prompt_assertions:
  first_call:
    - id: calls-any-grep
      text: "Model's first call searches file contents — run_command with a grep or rg command"
      check: { first_call: true, tool: run_command, arg: command, matches: "\\b(grep|rg)\\b" }
      severity: critical
    - id: correct-pattern
      text: "The command searches for 'TODO'"
      check: { first_call: true, tool: run_command, arg: command, contains: "TODO" }
      severity: critical
    - id: not-glob
      text: "Model does NOT use find alone (which matches filenames, not contents)"
      severity: important
  cost:
    - id: single-call
      text: "Task completes in 1 tool call"
      check: { tool_calls: 1 }
      severity: important

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
