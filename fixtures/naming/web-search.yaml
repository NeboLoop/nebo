id: naming-web-search
name: "Naming test — search the web"
description: |
  Baseline task: search the web. Measures first-call tool naming accuracy.
target_component: search_web

conversation:
  - role: user
    content: "Search the web for 'best rust async runtime 2026'."

prompt_assertions:
  first_call:
    - id: calls-any-search
      text: "Model searches the web — search_web(queries: [...]), loaded with find_tools first, or web_search(query: '...') depending on convention"
      check: { tool: [search_web, web, web_search] }
      severity: critical
    - id: has-query
      text: "Model passes a query about rust async runtime (search_web takes `queries`, an array)"
      check: { tool: [search_web, web], arg: queries, matches: "(?i)rust" }
      severity: critical
    - id: not-fetch
      text: "Model does NOT use fetch_url or http_request to hit a specific URL"
      severity: important
  cost:
    - id: single-call
      text: "Task completes in 1-2 tool calls (find_tools to load search_web counts as one)"
      check: { max_tool_calls: 2 }
      severity: important

ideal_behavior:
  tool_calls: 1
  total_tokens: 1500
