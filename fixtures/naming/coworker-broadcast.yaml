id: naming-coworker-broadcast
name: "Naming test — introduce yourself to the other employees"
description: |
  Live incident (Rig/Piper, 2026-08-24): "introduce yourself to the other
  bots" routed to the loop tool (hub channels), hit "no loop available", and
  the model concluded coworkers were unreachable — while the coworker message
  rail sat unused. The loop tool's description steered it wrong ("Use loop
  for bot-to-bot communication"). This pins the corrected routing: local
  coworkers are message(resource: 'coworker'), no channel required.

  SAFETY: the ask names the two disposable coworkers explicitly. An unbounded
  "introduce yourself to the other bots" on a live roster broadcast a false
  "I'm in charge" claim to every REAL employee (who replied, and whose
  sessions then needed manual cleanup). Eval sessions are isolated; coworker
  messages are not — never point this fixture's model at an open roster.
target_component: message

setup:
  - "curl -s -X POST localhost:27895/api/v1/agents -H 'Content-Type: application/json' -d '{\"blank\":true,\"name\":\"ops-manager\"}' > /dev/null"
  - "curl -s -X POST localhost:27895/api/v1/agents -H 'Content-Type: application/json' -d '{\"blank\":true,\"name\":\"front-desk\"}' > /dev/null"
teardown:
  - "python3 -c \"import json,urllib.request as u; ags=json.load(u.urlopen('http://localhost:27895/api/v1/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name') in ('ops-manager','front-desk')]; [u.urlopen(u.Request('http://localhost:27895/api/v1/agents/'+i, method='DELETE')) for i in ids]\""

conversation:
  - role: user
    content: "please introduce yourself to the other bots — ops-manager and front-desk — and let them know that I put you in charge of those two"

prompt_assertions:
  first_call:
    - id: no-loop-detour
      text: "First call is roster discovery or a coworker message — never the loop tool (hub channels are not how local coworkers are reached)"
      check: { first_call: true, tool: [message, agent] }
      severity: critical
    - id: messages-a-coworker
      text: "Some call sends a coworker message via the canonical rail"
      check: { tool: message, arg: resource, equals: "coworker" }
      severity: critical
    - id: send-action
      text: "The coworker message uses action: 'send'"
      check: { tool: message, arg: action, equals: "send" }
      severity: critical
    - id: targets-named-coworker
      text: "A message goes to one of the named test coworkers (never the wider roster)"
      check: { tool: message, arg: to, matches: "(?i)ops-manager|front-desk" }
      severity: critical
  cost:
    - id: bounded-calls
      text: "Roster lookup plus one message per coworker — at most 6 calls"
      check: { max_tool_calls: 6 }
      severity: important

ideal_behavior:
  tool_calls: 3
  total_tokens: 4000
