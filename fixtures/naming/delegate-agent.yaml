id: naming-coworker-message
name: "Naming test — hand work to a named coworker"
description: |
  Baseline task: ask a named employee to do something. The delegate action was
  removed — work for a named coworker is a MESSAGE (their session, their
  memory, owner-visible on both sides). Measures first-call naming accuracy
  for the canonical pathway: send_message(to: <employee>), loaded with
  find_tools first.
target_component: send_message

setup:
  - "curl -s -X POST ${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents -H 'Content-Type: application/json' -d '{\"blank\":true,\"name\":\"chief-of-staff\"}' > /dev/null"
teardown:
  - "python3 -c \"import json,urllib.request as u; ags=json.load(u.urlopen('http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents'))['agents']; ids=[a['id'] for a in ags if a.get('name')=='chief-of-staff']; [u.urlopen(u.Request('http://${NEBO_TEST_SERVER:-localhost:27895}/api/v1/agents/'+i, method='DELETE')) for i in ids]\""

conversation:
  - role: user
    content: "Ask the chief-of-staff agent to check my calendar for today."

prompt_assertions:
  first_call:
    - id: calls-send-message
      text: "Model messages the employee with send_message (not a helper)"
      check: { tool: send_message }
      severity: critical
    - id: has-recipient
      text: "Model addresses chief-of-staff"
      check: { tool: send_message, arg: to, contains: "chief" }
      severity: critical
  cost:
    - id: two-calls
      text: "Task completes in at most 2 tool calls (find_tools to load send_message counts as one)"
      check: { max_tool_calls: 2 }
      severity: important

ideal_behavior:
  tool_calls: 2
  total_tokens: 2000
