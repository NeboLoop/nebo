id: naming-edit-file
name: "Naming test — edit a file"
description: |
  Baseline task: replace text in a file. Measures first-call tool naming accuracy.
target_component: edit_file

setup:
  - "printf 'Hello there\n' > /tmp/nebo-greeting.txt"
teardown:
  - "rm -f /tmp/nebo-greeting.txt"

conversation:
  - role: user
    content: "In the file /tmp/nebo-greeting.txt, replace 'Hello' with 'Goodbye'."

prompt_assertions:
  first_call:
    # Calibration 2026-08-24: the model consistently verifies-then-edits on a
    # natural-language ask (read call 1, edit call 2 with perfect anchors) —
    # which the shipped prompt doctrine prescribes ("verify a remembered path
    # or value before acting"). A first-call edit is the leaner ideal, kept as
    # an important signal; the critical claims are the edit itself and its args.
    - id: calls-any-edit
      text: "Model's first call is the edit — edit_file on the target file (verify-first costs one extra call)"
      check: { first_call: true, tool: edit_file }
      severity: important
    - id: correct-path
      text: "The edit targets the correct file path"
      check: { tool: edit_file, arg: path, equals: "/tmp/nebo-greeting.txt" }
      severity: critical
    - id: has-old-string
      text: "The edit call anchors on the existing text (old_string contains 'Hello')"
      check: { tool: edit_file, arg: old_string, contains: "Hello" }
      severity: critical
    - id: has-new-string
      text: "The edit call replaces with text containing 'Goodbye'"
      check: { tool: edit_file, arg: new_string, contains: "Goodbye" }
      severity: critical
  cost:
    - id: within-three-calls
      text: "Task completes in at most 3 tool calls: read, edit, and a read that verifies the edit landed"
      check: { max_tool_calls: 3 }
      severity: important

ideal_behavior:
  tool_calls: 3
  total_tokens: 2000
