id: naming-write-file
name: "Naming test — write a file"
description: |
  Baseline task: write a file. Measures first-call tool naming accuracy.
target_component: write_file

setup:
  - "rm -f /tmp/nebo-greeting.txt"
teardown:
  - "rm -f /tmp/nebo-greeting.txt"

conversation:
  - role: user
    content: "Create a file at /tmp/nebo-greeting.txt with the content 'Hello, World!'"

prompt_assertions:
  first_call:
    - id: calls-any-write
      text: "Model's first call writes the file — write_file(path: '...', content: '...')"
      check: { first_call: true, tool: write_file }
      severity: critical
    - id: correct-path
      text: "Model passes the correct file path"
      check: { first_call: true, arg: path, equals: "/tmp/nebo-greeting.txt" }
      severity: critical
    - id: has-content
      text: "Model passes content containing 'Hello, World!'"
      check: { first_call: true, arg: content, contains: "Hello, World!" }
      severity: critical
  cost:
    - id: write-then-verify
      text: "Task completes in no more than 2 tool calls: the write, and a read that verifies the file landed"
      check: { max_tool_calls: 2 }
      severity: important

ideal_behavior:
  tool_calls: 2
  total_tokens: 2000
