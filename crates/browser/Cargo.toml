[package]
name = "nebo-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
command = { workspace = true }
tls = { workspace = true }
types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
chromiumoxide = { workspace = true }
futures = "0.3"
rand = { workspace = true }
url = "2"
anyhow = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The default browser (`default_browser`): LaunchServices on macOS, the
# shell's https association on Windows
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSBundle"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
