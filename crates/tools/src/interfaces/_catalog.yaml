# Interface catalog — every capability a seat may bind, and every operation on it.
#
# A capability is a typed INTERFACE, never a product: a seat declares
# `requires.interfaces: ["ledger"]` and the company binds whichever system it already
# runs. The port address inside a seat is <department>.<role>.<capability>.<resource>.<action>;
# plugins match on the operation suffix, so one plugin declaration satisfies every seat
# that calls it.
#
# gated: true  -> money movement, outbound contact, or an irreversible write. The runtime
#                 asks before the bound tool runs.
# gated: false -> a read, or a protective act that is reversible and worthless if it waits.
#                 Pause, halt, suppress, cancel, quarantine, roll back and export are
#                 deliberately ungated: a delayed suppression is a sent message, and an
#                 exceeded spend cap cannot be un-spent. Their opposites — resume, publish,
#                 send, start — are gated.
# critical: true -> money movement, contract formation, the company's own file, or the
#                 standing authority to act unattended. Always gated as well. An
#                 employee-wide full-autonomy default never loosens a critical
#                 operation; the owner grants each one per employee, per operation.
#
# Capabilities with a fully typed contract have their own file beside this one
# (ledger.yaml is the exemplar); this catalog is the index of all of them.


