# ── The company's own governance ──────────────────────────────────────────────
#
# Two capabilities the RUNTIME performs itself. There is no product behind either
# one and no plugin binding to resolve: the operation names below are the ones the
# runtime already carries, and every seat can reach them, which is why the owner
# grants them per employee rather than a company binding them once.

layers:    # The company's own description: the industry, franchise and company layers every employee reads.
  layers.company.read:      { gated: false }   # What the company layer holds today: its words, parties, rules, laws and settled numbers.
  layers.company.write:     { gated: true, critical: true }   # Writes the company layer, whole. Granted per employee and never acquired by a general default.
  layers.company.remove:    { gated: true, critical: true }   # Its own grant: an employee that may write the layer does not thereby get to delete it.
  layers.franchise.write:   { gated: true  }
  layers.franchise.remove:  { gated: true  }
  layers.industry.write:    { gated: true  }   # A trade layer other companies will work by, so publishing it means review.
  layers.industry.remove:   { gated: true  }

authority:    # Standing authority for seats, inside the bounds the company layer sets.
  authority.constitution.show:  { gated: false }   # The company's own unattended bounds, which no grant may exceed.
  authority.grant.list:         { gated: false }   # What one seat may do unattended today, and inside which bounds.
  authority.grant.grant:        { gated: true, critical: true }   # Lets a seat run a gated operation unattended inside bounds. Refused past the company's bounds, a reserved operation, or a locked rule.
  authority.grant.widen:        { gated: true, critical: true }   # Loosens a bound, and only on evidence from the record.
  authority.grant.narrow:       { gated: false }   # Takes scope away. Protective and reversible: scope left in place while a narrowing waits is scope still being used.
  authority.grant.suspend:      { gated: false }   # The seat asks again until a new grant. Protective, on the same reasoning as narrowing.

