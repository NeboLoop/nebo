name: permissions
description: |
  What "correct" means for autonomous permissions (PRD-Permissions
  2026-09-24 §7; technical design §2.12, WP2.16). One check, one set of
  rules, one ask card: inside its job an employee acts without asking, and
  the owner consents to jobs, not actions. These fixtures fail against
  today's seven scattered mechanisms and pass once WP2.11-2.14 land
  (§2.12.3-2.12.7); the doors, host-check, expiry and heartbeat-parking
  scenarios are purely code-decided and run as deterministic proofs
  (empty conversation, no model, no server) rather than judged
  conversations — the same split the engine suite uses for its own parked-
  approval parity proof. Program checks decide what is mechanical (a tool
  call was or wasn't made, a reply names or never claims an outcome); the
  judge reads the rest. Main's result on this suite is recorded before the
  branch changes it (WP2.16 deliverable).
