name: staffed-company
# The staffed company's deterministic proof: every mechanism that landed with
# it, one fixture each, driven through the REAL server booted in-process on a
# temporary NEBO_HOME with no network and no model. Each fixture names the
# Rust test that proves it; the runner executes that test.
#
#   make test-staffed-proof
#   nebo-cli test run --suite suites/staffed-company.yaml --no-judge
#
# `cargo test -p nebo-server --lib -- staffed_proof` runs the same tests
# directly, which is how CI's workspace test run includes them.
