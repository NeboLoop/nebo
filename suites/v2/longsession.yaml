# v2: the new harness's twin of suites/longsession.yaml. Same scenarios (same fixture
# ids, messages, setup and files); checks written for the rewrite's tools.
# Arm A runs suites/longsession.yaml, arm P runs this file; both from one instrument
# tag, compared per fixture. What changed per check: fixtures/v2/MAPPING.md.
name: longsession
# Long-session behavioural fixtures: sliding-window eviction (>80 messages)
# and micro-compaction of large tool results. These are the two seams no
# single-shot fixture exercises — and where the forged "[os] 0 lines" outage
# lived. Expensive: each fixture is many real LLM round trips. Run rarely,
# deliberately, against a live server:
#   make test-live SUITE=longsession
fixtures:
  - ../../fixtures/v2/longsession/window-eviction-recall.yaml
  - ../../fixtures/v2/longsession/compaction-large-reads.yaml
  - ../../fixtures/v2/longsession/compaction-frozen-across-turns.yaml
