# v2: the new harness's twin of suites/error-correction.yaml. Same scenarios (same fixture
# ids, messages, setup and files); checks written for the rewrite's tools.
# Arm A runs suites/error-correction.yaml, arm P runs this file; both from one instrument
# tag, compared per fixture. What changed per check: fixtures/v2/MAPPING.md.
